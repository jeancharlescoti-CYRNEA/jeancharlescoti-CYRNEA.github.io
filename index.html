<body>
<div class="wrap">
<div class="header"><div class="brand">CYRNEA ASSISTANT<small>Appel · préparation · terrain · restitution</small></div><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end"><button id="homeTop" class="btn ghost" onclick="goHome()">⌂ ACCUEIL</button><button id="backTop" class="btn ghost hidden" onclick="backStep()">← ÉTAPE PRÉCÉDENTE</button><div class="badge" id="status">ACCUEIL</div></div></div>
<div id="timeline" class="timeline"></div>
<main id="app"></main>
</div>
<script>
const STATES=["ACCUEIL","QUALIFICATION","CADRAGE","CRÉNEAU","RÉSERVATION","PRÊTE","TERRAIN","RESTITUTION","CLÔTURE","ARCHIVE"];
let S={stage:"ACCUEIL",mode:null,universe:null,caller:null,name:"",phone:"",email:"",city:"",need:null,sub:null,result:null,obj:"",date:"",slot:"",acceptedSlot:false,draftKey:"",missionId:"",prep:{},facts:"",incident:"",terrainMedia:[],arrivalAt:"",departureAt:"",callbackReason:"",callbackPhoneCountry:"+33",callbackPhoneRaw:"",finalStatus:"",passage:1,multiSlots:[],availability:{},overrun:null,specialPending:false,resumeStage:"",history:["ACCUEIL"]};
let NAV=[];
let LAST_VIEW=null;
const ZONES=["porto-vecchio","porto vecchio","lecci","sotta","sainte-lucie","sainte lucie","pinarello","tarco"];
function esc(x){return String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}

function normalizeFrenchPhone(raw){
  let d=String(raw||'').replace(/\D/g,'');
  if(d.startsWith('0033')) d=d.slice(4);
  else if(d.startsWith('33')) d=d.slice(2);
  if(d.startsWith('0')) d=d.slice(1);
  if(d.length===9){
    return '+33 '+d[0]+' '+d.slice(1).match(/.{1,2}/g).join(' ');
  }
  return String(raw||'').trim();
}
function formatFrenchPhoneTyping(raw){
  let d=String(raw||'').replace(/\D/g,'');
  if(d.startsWith('0033')) d='0'+d.slice(4);
  else if(d.startsWith('33') && d.length>2) d='0'+d.slice(2);
  d=d.slice(0,10);
  return (d.match(/.{1,2}/g)||[]).join(' ');
}
function formatPhoneInput(el){
  if(!el)return;
  const country=document.getElementById('phoneCountry')?.value||'+33';
  if(country==='+33') el.value=formatFrenchPhoneTyping(el.value);
}
function refreshPhoneFormat(){
  const el=document.getElementById('p');
  if(el)formatPhoneInput(el);
}
let STAGE_VIEWS={};
let REACHED_STAGES=new Set(["ACCUEIL"]);
const STAGE_VIEWS_KEY="cyrnea_stage_views_v50";
function serializeAppHtml(){
 const app=document.getElementById("app"); if(!app)return "";
 const c=app.cloneNode(true);
 [...app.querySelectorAll("input,select,textarea")].forEach((src,i)=>{const dst=c.querySelectorAll("input,select,textarea")[i];if(!dst)return;if(src.tagName==="INPUT"){dst.setAttribute("value",src.value);if(src.checked)dst.setAttribute("checked","");else dst.removeAttribute("checked");}else if(src.tagName==="SELECT"){[...dst.options].forEach((o,j)=>{if(j===src.selectedIndex)o.setAttribute("selected","");else o.removeAttribute("selected")});}else dst.textContent=src.value;});
 return c.innerHTML;
}
function syncReached(){S.history=STATES.filter(x=>REACHED_STAGES.has(x))}
function setStage(st){S.stage=st;REACHED_STAGES.add(st);syncReached();document.getElementById("status").textContent=st;drawTimeline()}
function drawTimeline(){document.getElementById("timeline").innerHTML=STATES.map(x=>{const reached=REACHED_STAGES.has(x),cur=S.stage===x;return `<button type="button" class="state ${reached?"on clickable":""} ${cur?"current":""}" ${reached?`onclick="gotoStage('${x}')" title="Revenir à ${x}"`:"disabled"}>${x}</button>`}).join("")}
function updateBack(){const b=document.getElementById("backTop");if(b)b.classList.toggle("hidden",NAV.length===0)}
function snapshot(){return {s:JSON.stringify(S),html:serializeAppHtml(),status:document.getElementById("status").textContent,timeline:document.getElementById("timeline").innerHTML}}
function cloneView(v){return v?{s:v.s,html:v.html,status:v.status,timeline:v.timeline}:null}
function saveStageViews(){try{localStorage.setItem(STAGE_VIEWS_KEY,JSON.stringify(STAGE_VIEWS))}catch(e){}}
function storeCurrentStageView(){if(!LAST_VIEW)return;let oldStage="";try{oldStage=JSON.parse(LAST_VIEW.s||"{}").stage||LAST_VIEW.status}catch(e){oldStage=LAST_VIEW.status}if(!oldStage)return;const temp={...S,stage:oldStage};const v={s:JSON.stringify(temp),html:serializeAppHtml(),status:LAST_VIEW.status||oldStage,timeline:document.getElementById("timeline").innerHTML};STAGE_VIEWS[oldStage]=cloneView(v);LAST_VIEW=cloneView(v);saveStageViews()}
function restoreView(snap){if(!snap)return false;const restored=JSON.parse(snap.s);(restored.history||[]).forEach(x=>REACHED_STAGES.add(x));S=restored;syncReached();document.getElementById("app").innerHTML=snap.html;document.getElementById("status").textContent=snap.status;LAST_VIEW=cloneView(snap);drawTimeline();updateBack();save();window.scrollTo({top:0,behavior:"instant"});return true}
function draw(x,remember=true){
 const app=document.getElementById("app");
 if(remember&&LAST_VIEW&&LAST_VIEW.html.trim()){storeCurrentStageView();NAV.push(cloneView(LAST_VIEW));}
 app.innerHTML=x;
 LAST_VIEW=snapshot(); STAGE_VIEWS[S.stage]=cloneView(LAST_VIEW); saveStageViews();
 updateBack(); drawTimeline();
 window.scrollTo({top:0,behavior:"instant"});
}
function backStep(){
 if(!NAV.length)return;
 storeCurrentStageView();
 const snap=NAV.pop();
 restoreView(snap);
}
function gotoStage(st){
 if(!REACHED_STAGES.has(st))return;
 if(st===S.stage)return;
 const fromStage=S.stage;
 storeCurrentStageView();
 if(LAST_VIEW&&LAST_VIEW.html.trim())NAV.push(cloneView(LAST_VIEW));
 if(st==="ACCUEIL"){ if(fromStage!=="ACCUEIL") S.resumeStage=fromStage; save(); return home(false); }
 const snap=STAGE_VIEWS[st];
 if(snap)return restoreView(snap);
 if(st==="QUALIFICATION")return identify();
 if(st==="CADRAGE")return S.result?showResult():needs();
 if(st==="CRÉNEAU")return slot();
 if(st==="RÉSERVATION")return bookingHandoff();
 if(st==="PRÊTE")return S.prep?.addr?ready():preparationMission();
 if(st==="TERRAIN")return terrain();
 if(st==="RESTITUTION")return restitution();
 if(st==="CLÔTURE")return closeMission();
 if(st==="ARCHIVE")return archive();
}
const STATE_KEY="cyrnea_assistant_v50";
const LEGACY_STATE_KEY="cyrnea_assistant_v49";
function save(){localStorage.setItem(STATE_KEY,JSON.stringify(S))}
function reset(){localStorage.removeItem(STATE_KEY);localStorage.removeItem(LEGACY_STATE_KEY);localStorage.removeItem(STAGE_VIEWS_KEY);location.reload()}
function key(){return "D-"+new Date().toISOString().replace(/\D/g,"").slice(0,14)}
function missionId(){
  const p=S.result.contract==="RELAIS"?"RP":"CP";
  const n=new Date();
  const year=n.getFullYear();
  const seq=String(Date.now()).slice(-4);
  return `${p}-${year}-${seq}`;
}
function goHome(){
 if(S.stage==="ACCUEIL" && document.querySelector("#app h1")?.textContent==="CYRNEA ASSISTANT") return;
 if(S.stage!=="ACCUEIL") S.resumeStage=S.stage;
 save();
 home(true);
 save();
}
function home(remember=true){
 const hasQualifiedMission=!!(S.result && String(S.result.mission||"").trim() && String(S.result.contract||"").trim());
 const hasClient=!!String(S.name||"").trim();
 const hasContact=!!(String(S.phone||"").trim() || String(S.email||"").trim());
 const hasActive=!S.finalStatus && hasQualifiedMission && hasClient && hasContact;
 setStage("ACCUEIL"); S.draftKey=S.draftKey||key();
 draw(`<div class="card"><h1>CYRNEA ASSISTANT</h1>
 <div class="bigQuestion">Que voulez-vous faire ?</div>
 ${hasActive?`<button class="choice presence" onclick="resumeActiveMission()"><span class="missionName">REPRENDRE LA MISSION EN COURS</span><span class="missionGoal">${esc(S.result?.mission||"Mission en cours")} · ${esc(S.name||"Client")}</span></button>`:""}
 <div class="grid" style="margin-top:10px">
   <button class="choice" onclick="newMission()"><span class="missionName">NOUVELLE MISSION</span><span class="missionGoal">Repartir entièrement de zéro et recommencer la qualification.</span></button>
   <button class="choice" onclick="S.mode='CALLBACK';callback()"><span class="missionName">NOTER UN RAPPEL</span><span class="missionGoal">Nom, téléphone et motif en quelques secondes.</span></button>
 </div>
 <div class="operatorOnly">Ne choisissez jamais une prestation au hasard. Écoutez le client et suivez l’écran.</div>
 </div>`,remember);
}
function newMission(){
 localStorage.removeItem(STATE_KEY); localStorage.removeItem(LEGACY_STATE_KEY); localStorage.removeItem(STAGE_VIEWS_KEY); STAGE_VIEWS={}; REACHED_STAGES=new Set(["ACCUEIL"]);
 S={stage:"ACCUEIL",mode:"FULL",universe:null,caller:null,name:"",phone:"",email:"",city:"",need:null,sub:null,result:null,obj:"",date:"",slot:"",acceptedSlot:false,draftKey:key(),missionId:"",prep:{},facts:"",incident:"",terrainMedia:[],arrivalAt:"",departureAt:"",callbackReason:"",callbackPhoneCountry:"+33",callbackPhoneRaw:"",finalStatus:"",passage:1,multiSlots:[],availability:{},overrun:null,specialPending:false,resumeStage:"",history:["ACCUEIL"]};
 NAV=[]; LAST_VIEW=null;
 home(false);
 identify();
 updateBack(); save();
}
function newCall(){return newMission()}
function resumeActiveMission(){
 const st=S.resumeStage||S.stage||"";
 S.resumeStage="";
 if(st==="ARCHIVE" || S.finalStatus) return archive();
 if(st==="CLÔTURE") return closeMission();
 if(st==="RESTITUTION" || (S.departureAt && S.facts)) return restitution();
 if(st==="TERRAIN") return terrain();
 if(st==="PRÊTE" || S.prep?.addr) return ready();
 if(st==="RÉSERVATION" || S.missionId || (S.result && S.acceptedSlot)) return S.missionId?preparationMission():bookingHandoff();
 if(st==="CRÉNEAU" && S.result) return slot();
 if(st==="CADRAGE" && S.result) return showResult();
 if(S.result) return showResult();
 return identify();
}
function callback(){draw(`<div class="card"><h1>Rappel à faire</h1>
<div class="field"><label>Nom</label><input id="n" value="${esc(S.name||"")}"></div>
<div class="field"><label>Téléphone</label>
<div style="display:grid;grid-template-columns:180px 1fr;gap:8px">
<select id="phoneCountry" onchange="refreshPhoneFormat()">
<option value="+33">🇫🇷 France +33</option>
<option value="+41">🇨🇭 Suisse +41</option>
<option value="+32">🇧🇪 Belgique +32</option>
<option value="+352">🇱🇺 Luxembourg +352</option>
<option value="+39">🇮🇹 Italie +39</option>
<option value="+49">🇩🇪 Allemagne +49</option>
</select>
<input id="p" inputmode="tel" autocomplete="tel" placeholder="06 12 34 56 78" oninput="formatPhoneInput(this)" value="${esc(S.callbackPhoneRaw||"")}">
</div></div>
<div class="field"><label>Motif du rappel</label>
<select id="r" onchange="toggleCallbackOther()">
<option>Artisan / livraison / intervention</option>
<option>Clé / accès / tiers</option>
<option>Intempérie</option>
<option>Voir / documenter</option>
<option>Décision / rendez-vous</option>
<option>Projet entreprise</option>
<option value="__OTHER__">AUTRE — exception</option>
</select></div>
<div class="field hidden" id="callbackOtherWrap"><label>Motif exceptionnel — quelques mots</label><input id="callbackOther" maxlength="80"></div>
<div class="toolbar"><button class="btn primary" onclick="saveCallback()">ENREGISTRER LE RAPPEL</button></div></div>`);
 setTimeout(()=>{const c=document.getElementById("phoneCountry");if(c)c.value=S.callbackPhoneCountry||"+33";refreshPhoneFormat()},0);
}
function saveCallback(){
 const name=(document.getElementById("n")?.value||"").trim();
 const raw=(document.getElementById("p")?.value||"").trim();
 const country=document.getElementById("phoneCountry")?.value||"+33";
 const r=document.getElementById("r")?.value||"";
 const other=(document.getElementById("callbackOther")?.value||"").trim();
 if(!name||!raw)return alert("Nom et téléphone requis.");
 if(r==="__OTHER__"&&!other)return alert("Précisez le motif du rappel.");
 S.name=name;
 S.callbackPhoneRaw=raw;
 S.callbackPhoneCountry=country;
 S.phone=country==="+33"?normalizeFrenchPhone(raw):country+" "+raw;
 S.callbackReason=r==="__OTHER__"?other:r;
 save();
 draw(`<div class="card"><h1>Rappel enregistré</h1>
   <div class="row"><b>Nom</b><span>${esc(S.name)}</span></div>
   <div class="row"><b>Téléphone</b><span>${esc(S.phone)}</span></div>
   <div class="row"><b>Motif</b><span>${esc(S.callbackReason)}</span></div>
   <button class="btn primary" onclick="S.mode='FULL';identify()">REPRENDRE LA QUALIFICATION</button>
 </div>`);
}
function toggleCallbackOther(){
 const s=document.getElementById("r"),w=document.getElementById("callbackOtherWrap");
 if(s&&w)w.classList.toggle("hidden",s.value!=="__OTHER__");
}
function identify(){
 setStage("QUALIFICATION");
 draw(`<div class="card"><h1>Étape 1 — Qui appelle ?</h1>
 <div class="guideTitle">QUESTION 1</div><div class="bigQuestion">D’où vient l’appel ?</div><div class="field"><label>Origine de l’appel</label><select id="u">
 <option value="RELAIS">Site / numéro RELAIS PROPRIÉTAIRE</option>
 <option value="PRÉSENCE">Site / numéro CYRNEA PRÉSENCE</option>
 <option value="INDÉTERMINÉ">Autre / ne sait pas</option>
 </select>
 <div class="muted" style="margin-top:4px">L’origine de l’appel aide au routage mais ne décide pas, à elle seule, de la mission.</div></div>
 <div class="guideTitle">QUESTION 2</div><div class="bigQuestion">Le client appelle pour lui-même ou pour une entreprise ?</div><div class="field"><label>Client agit dans quel cadre ?</label><select id="c">
 <option value="OWNER">PROPRIÉTAIRE / PARTICULIER — besoin privé</option>
 <option value="B2B">ENTREPRISE / PROFESSIONNEL — besoin professionnel</option>
 </select></div>
 <div class="guideTitle">QUESTION 3</div><div class="bigQuestion">Qui est votre interlocuteur ?</div><div class="field"><label>Nom / société</label><input id="n" value="${esc(S.name||"")}"></div><div class="field"><label>Téléphone</label>
<div style="display:grid;grid-template-columns:180px 1fr;gap:8px">
<select id="phoneCountry" onchange="refreshPhoneFormat()">
<option value="+33">🇫🇷 France +33</option>
<option value="+41">🇨🇭 Suisse +41</option>
<option value="+32">🇧🇪 Belgique +32</option>
<option value="+352">🇱🇺 Luxembourg +352</option>
<option value="+39">🇮🇹 Italie +39</option>
<option value="+49">🇩🇪 Allemagne +49</option>
</select>
<input id="p" inputmode="tel" autocomplete="tel" placeholder="06 12 34 56 78" oninput="formatPhoneInput(this)" value="${esc(S.callbackPhoneRaw||"")}">
</div>
</div>
<div class="field"><label>E-mail</label><input id="e" type="email" placeholder="adresse@exemple.fr"></div>
<div class="field"><label>Commune du bien / site de la mission</label>
<select id="city" onchange="toggleOtherCity()">
<option value="">— Choisir —</option>
<option value="Porto-Vecchio">Porto-Vecchio</option>
<option value="Lecci">Lecci</option>
<option value="Sotta">Sotta</option>
<option value="Sainte-Lucie-de-Porto-Vecchio / Pinarello">Sainte-Lucie-de-Porto-Vecchio / Pinarello</option>
<option value="Tarco">Tarco</option>
<option value="__OTHER__">AUTRE SECTEUR — préciser</option>
</select>

    "Donner accès pour la livraison / installation / dépannage puis repartir"

  ];
  else if(m==="RELAIS SIMPLE" && S.need==="KEY" && S.sub==="GET") out=[
    "Récupérer la clé / le badge auprès de la personne désignée"

  else if(m==="RELAIS" && S.need==="OPEN") out=[
    "Ouvrir le bien avant l’arrivée et réaliser les actions simples convenues"
  ];
  else if(m.includes("AVANT INTEMPÉRIE")) out=[
    "Fermer / mettre à l’abri les éléments précisément désignés avant l’intempérie"
  ];
  else if(m.includes("APRÈS INTEMPÉRIE")) out=[
    "Vérifier après l’intempérie les points pratiques précisément désignés"
  ];
  else if(m.includes("VOIR")) out=[
    "Observer et documenter un point précis sur place, puis restituer uniquement ce qui est objectivement visible"
  ];
  else if(m==="DÉCIDER") out=[
    "Recueillir les éléments factuels prévus au cahier des charges avant la décision du client"
  ];
  else if(m==="SUIVRE") out=[

  ];
  else if(["ACCÈS B2B","REMISE CLÉ / BADGE B2B","RÉCUPÉRATION CLÉ / BADGE B2B","PRÉSENCE LOGISTIQUE B2B"].includes(m)){
    if(S.sub==="ACCESS") out=["Donner accès à l’intervenant professionnel désigné puis repartir"];
    else if(S.sub==="KEY_GIVE") out=["Remettre une clé / un badge à la personne désignée"];
    else if(S.sub==="KEY_GET") out=["Récupérer une clé / un badge auprès de la personne désignée"];
    else if(S.sub==="STAY") out=["Rester présent pendant le créneau professionnel convenu, sans contrôle technique"];
  }
  else if(m==="VISITE TERRAIN PILOTÉE") out=[
    "Voir et documenter un site en Corse avant d’y déplacer une équipe ou un technicien."
  ];
  else if(m==="PRÉSENCE PROJET") out=[
    "Être présent sur site en Corse lorsque votre équipe est à distance, pour observer, échanger et documenter un moment important du projet."
  ];

function daysUntilMission(){
  if(!S.date)return 9999;
  const today=new Date(); today.setHours(0,0,0,0);
  const d=new Date(S.date+"T00:00:00");
  return Math.ceil((d-today)/86400000);
}
function earlyExecutionNeeded(){
  return S.caller==="OWNER" && daysUntilMission()>=0 && daysUntilMission()<14;
}

const VAT_RATE=0.20; // Taux de travail du prototype ; à confirmer comptablement avant production.

function isB2BContract(){
  return S.result?.contract==="PRÉSENCE ENTREPRISES";
}
function parseEuroAmount(v){
  const s=String(v||"").replace(/\u00a0/g," ").replace(/\s/g,"").replace(",",".");
  const m=s.match(/(\d+(?:\.\d+)?)/);
  return m?Number(m[1]):null;
}
function euro(n){
  return Number(n).toLocaleString("fr-FR",{minimumFractionDigits:0,maximumFractionDigits:2})+" €";
}
function priceParts(){
  const raw=String(S.result?.price||"-");
  const amount=parseEuroAmount(raw);
  if(!isB2BContract()||amount==null) return {b2b:false,raw};
  const ht=amount, vat=Math.round((ht*VAT_RATE+Number.EPSILON)*100)/100, ttc=Math.round((ht+vat+Number.EPSILON)*100)/100;
  return {b2b:true,raw,ht,vat,ttc};
}
function priceRows(){
  const p=priceParts();
  if(!p.b2b) return `<div class="row"><b>Prix</b><span>${esc(p.raw)}</span></div>`;
  return `<div class="row"><b>Prix HT</b><span>${esc(euro(p.ht))}</span></div>
          <div class="row"><b>TVA ${(VAT_RATE*100).toFixed(0)} %</b><span>${esc(euro(p.vat))}</span></div>
          <div class="row"><b>Total TTC</b><span><b>${esc(euro(p.ttc))}</b></span></div>`;
}
function priceText(){
  const p=priceParts();
  if(!p.b2b) return p.raw;
  return `${euro(p.ht)} HT + ${euro(p.vat)} TVA = ${euro(p.ttc)} TTC`;
}
function paymentAmountText(){
  const p=priceParts();
  return p.b2b?euro(p.ttc)+" TTC":p.raw;
}
function scheduleText(){
  if(S.result?.multi && Array.isArray(S.multiSlots)){
    const known=S.multiSlots.map(p=>`Jalon ${p.index}: ${p.date} ${displayTime4(p.time)} (${p.label})`);
    const missing=Math.max(0,3-S.multiSlots.length);
    if(missing) known.push(`${missing} jalon(s) restant(s) : date(s) à programmer ultérieurement`);
    return known.join(" | ");
  }
  return `${S.date||"-"} ${displayTime4(S.slot)||""}`.trim();
}

function pad2(n){return String(n).padStart(2,"0")}
function normalizeTime4(v){
  const m=String(v||"").match(/^(\d{1,2}):(\d{2})$/);
  if(!m) return "";
  return `${pad2(Number(m[1]))}:${m[2]}`;
}

function todayLocalISO(){
  const n=new Date();

}
function currentLocalHM(){
  const n=new Date();
  return `${pad2(n.getHours())}:${pad2(n.getMinutes())}`;
}
function easterSunday(year){
  // Meeus/Jones/Butcher Gregorian algorithm.
  const a=year%19, b=Math.floor(year/100), c=year%100;
  const d=Math.floor(b/4), e=b%4, f=Math.floor((b+8)/25);
  const g=Math.floor((b-f+1)/3), h=(19*a+b-d-g+15)%30;
  const i=Math.floor(c/4), k=c%4, l=(32+2*e+2*i-h-k)%7;
  const m=Math.floor((a+11*h+22*l)/451);
  const month=Math.floor((h+l-7*m+114)/31);
  const day=((h+l-7*m+114)%31)+1;
  return new Date(year,month-1,day,12,0,0,0);
}
function addDays(d,n){
  const x=new Date(d.getTime()); x.setDate(x.getDate()+n); return x;
}
function isoOfDate(d){
  return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
}
function isFrenchPublicHoliday(dateStr){
  if(!dateStr) return false;
  const [y,m,d]=dateStr.split("-").map(Number);
  const fixed=new Set([
    `${y}-01-01`,`${y}-05-01`,`${y}-05-08`,`${y}-07-14`,
    `${y}-08-15`,`${y}-11-01`,`${y}-11-11`,`${y}-12-25`
  ]);
  if(fixed.has(dateStr)) return true;
  const easter=easterSunday(y);
  const movable=new Set([
    isoOfDate(addDays(easter,1)),   // lundi de Pâques
    isoOfDate(addDays(easter,39)),  // Ascension
    isoOfDate(addDays(easter,50))   // lundi de Pentecôte
  ]);
  return movable.has(dateStr);
}
function localDateTime(dateStr,timeStr){
  if(!dateStr||!timeStr) return null;
  const [y,m,d]=dateStr.split("-").map(Number);
  const [hh,mm]=timeStr.split(":").map(Number);
  return new Date(y,m-1,d,hh,mm,0,0);
}
function validateFutureSlot(dateStr,timeStr,label="créneau"){
  const normalized=normalizeTime4(timeStr);
  if(!/^\d{2}:\d{2}$/.test(normalized)) return {ok:false,msg:`Heure invalide pour ${label}. Utilisez toujours 4 chiffres au format HH:MM, par exemple 09:00 ou 14:30.`};
  timeStr=normalized;
  const dt=localDateTime(dateStr,timeStr);
  if(!dt) return {ok:false,msg:`Date et heure requises pour ${label}.`};
  const now=new Date();
  if(dt.getTime()<=now.getTime()){
    return {ok:false,msg:`Impossible de fixer ${label} dans le passé. Choisissez une date et une heure postérieures à maintenant.`};
  }
  return {ok:true,dt};
}
function autoConstraints(dateStr,timeStr){
  const dt=localDateTime(dateStr,timeStr);
  if(!dt) return {priority:false,evening:false,sunday:false};
  const now=new Date();
  const diff=dt.getTime()-now.getTime();
  const priority=diff>0 && diff<24*60*60*1000;
  const evening=dt.getHours()>=19;
  const sunday=dt.getDay()===0 || isFrenchPublicHoliday(dateStr);
  return {priority,evening,sunday};
}
function setAutoConstraint(prefix,dateId,timeId){
  const date=document.getElementById(dateId)?.value||"";
  const time=document.getElementById(timeId)?.value||"";
  const c=autoConstraints(date,time);
  const p=document.getElementById(`prio24${prefix}`);
  const e=document.getElementById(`evening${prefix}`);
  const s=document.getElementById(`sunholiday${prefix}`);
  if(p){p.checked=c.priority;p.disabled=true}
  if(e){e.checked=c.evening;e.disabled=true}
  if(s){s.checked=c.sunday;s.disabled=true}
}
function refreshCalendarConstraints(){
  const today=todayLocalISO();
  const nowHM=currentLocalHM();
  const pairs=[
    ["d","sl",""],
    ["d1","sl1","_1"],
    ["d2","sl2","_2"],
    ["d3","sl3","_3"]
  ];
  pairs.forEach(([dId,tId,prefix])=>{
    const d=document.getElementById(dId), t=document.getElementById(tId);
    if(!d||!t) return;
    d.min=today;
    if(d.value===today) t.min=nowHM; else t.removeAttribute("min");
    setAutoConstraint(prefix,dId,tId);
  });
}
function startCalendarTicker(){
  if(calendarTicker) clearInterval(calendarTicker);
  refreshCalendarConstraints();
  calendarTicker=setInterval(refreshCalendarConstraints,30000);
}

  }

function availabilityPricing(){
  let m=baseMissionName(S.result.mission);
  refreshCalendarConstraints();
  let priority=!!document.getElementById("prio24")?.checked;
  let evening=!!document.getElementById("evening")?.checked;
  let sunday=!!document.getElementById("sunholiday")?.checked;

  // Dimanche et jours fériés français sont détectés automatiquement à partir du créneau.
  if(S.date){
    const d=new Date(S.date+"T12:00:00");
    if(d.getDay()===0) sunday=true;
  }

  S.availability={priority,evening,sunday};
  S.result.mission=m;

  if(S.result.isQuote){
    S.result.availabilityLabel="Selon devis accepté — contraintes de créneau intégrées au devis";
    return;
  }

  // If this is a bespoke quote, the availability constraint must be included in the quote itself.
  if(m==="LOGISTIQUE / ACCÈS B2B" || String(S.result.price).includes("À CHIFFRER")) return;

  // B2B logistique simple : tarification fixe, avec majorations de créneau non cumulatives.
  if(["ACCÈS B2B","REMISE CLÉ / BADGE B2B","RÉCUPÉRATION CLÉ / BADGE B2B","PRÉSENCE LOGISTIQUE B2B"].includes(m)){
    const base=(m==="PRÉSENCE LOGISTIQUE B2B")?169:109;
    const add=sunday?60:(priority||evening)?40:0;
    S.result.price=(base+add)+" € HT";
    S.result.availabilityLabel=sunday?"Dimanche / jour férié":priority?"Prioritaire sous 24 h":evening?"Soir à partir de 19 h":"Standard";
    return;
  }

  // RELAIS : règle post-référentiel validée dans le prototype — sous 24 h = même majoration que soirée ; dimanche/férié supérieur.
  if(m==="RELAIS SIMPLE" || m==="RELAIS" || m.includes("INTEMPÉRIE")){
    const base=(m==="RELAIS SIMPLE"||m.includes("APRÈS INTEMPÉRIE"))?109:169;
    const add=sunday?60:(priority||evening)?40:0;
    S.result.price=(base+add)+" € TTC";
    S.result.availabilityLabel=sunday?"Dimanche / jour férié":priority?"Prioritaire sous 24 h":evening?"Soir à partir de 19 h":"Standard";
    return;
  }

  // PRÉSENCE Propriétaires.
  if(m==="VOIR PRÉSENCE" || m==="VOIR RELAIS"){
    let price=260,label="Standard";
    if(priority||evening){price=350;label=priority?"Prioritaire sous 24 h":"Soir à partir de 19 h";}

    S.result.price=price+" € TTC";
    S.result.mission=priority?"VOIR PRIORITAIRE":m;
    S.result.availabilityLabel=label;
    return;
  }
  if(m==="DÉCIDER"){
    let price=480,label="Standard";
    if(priority||evening){price=570;label=priority?"Prioritaire sous 24 h":"Soir à partir de 19 h";}
    if(sunday){price=600;label="Dimanche / jour férié";}
    S.result.price=price+" € TTC"; S.result.availabilityLabel=label; return;
  }
  if(m==="SUIVRE"){
    let add=0,label="Standard";
    if(priority||evening){add=90;label=(priority?"Prioritaire sous 24 h":"Soir à partir de 19 h")+" — passage concerné";}
    if(sunday){add=120;label="Dimanche / jour férié — passage concerné";}
    S.result.price=(980+add)+" € TTC";
    S.result.availabilityLabel=label;
    return;
  }

  // PRÉSENCE Entreprises B2B.
  const b2bBase={
    "VISITE TERRAIN PILOTÉE":350,
    "PRÉSENCE PROJET":490,
    "PRÉSENCE PROJET ÉTENDUE":690
  };
  if(b2bBase[m]!=null){
    let add=0,label="Standard";
    if(priority||evening){add=120;label=priority?"Prioritaire sous 24 h":"Soir à partir de 19 h";}
    if(sunday){add=180;label="Dimanche / jour férié";}
    S.result.price=(b2bBase[m]+add)+" € HT";
    S.result.availabilityLabel=label;
    return;
  }
  if(m==="CONTINUITÉ PROJET"){
    let add=0,label="Standard";
    if(priority||evening){add=120;label=(priority?"Prioritaire sous 24 h":"Soir à partir de 19 h")+" — jalon concerné";}
    if(sunday){add=180;label="Dimanche / jour férié — jalon concerné";}
    S.result.price=(1190+add).toLocaleString("fr-FR")+" € HT";
    S.result.availabilityLabel=label;
  }
}

function clientDocSuggestions(){
  const m=S.result?.mission||"";
  if(S.need==="ART") return ["Bon / ordre d’intervention si disponible","Photo ou consigne utile pour l’artisan"];
  if(S.need==="DEL") return ["Bon de livraison / référence de commande","Consigne utile à l’accès ou à l’installation"];
  if(S.need==="THIRD") return ["Document ou consigne à remettre / montrer au tiers si nécessaire"];
  if(S.need==="KEY") return ["Aucun document particulier en principe","Pièce utile uniquement si elle sécurise la remise / récupération"];
  if(m.includes("AVANT INTEMPÉRIE")) return ["Photo / repère des éléments à fermer ou rentrer","Consigne précise utile à l’intervention"];
  if(m.includes("APRÈS INTEMPÉRIE")) return ["Photo / repère des points à vérifier","Document de référence utile si comparaison nécessaire"];
  if(m.includes("VOIR")) return ["Photo(s) de référence","Devis / facture / document à comparer si utile"];
  if(m==="DÉCIDER") return ["Devis / facture / document du rendez-vous","Photos ou document(s) de référence"];
  if(m==="SUIVRE") return ["Photos / repères de référence","Document de cadrage commun aux 3 passages"];
  if(m==="VISITE TERRAIN PILOTÉE") return ["Brief / plan / photo de repère","Consignes d’accès ou de sécurité du site"];
  if(m==="PRÉSENCE PROJET") return ["Cahier des charges / ordre du jour","Document(s) à montrer, remettre ou vérifier","Consignes du site"];
  if(m==="PRÉSENCE PROJET ÉTENDUE") return ["Cahier des charges / ordre du jour","Plan / documents utiles aux différentes zones","Consignes du site"];
  if(m==="CONTINUITÉ PROJET") return ["Cahier des charges commun","Photos / repères de référence","Plan ou document de comparaison"];
  if(["ACCÈS B2B","PRÉSENCE LOGISTIQUE B2B","REMISE CLÉ / BADGE B2B","RÉCUPÉRATION CLÉ / BADGE B2B"].includes(m))
    return ["Bon d’intervention / bon de livraison si disponible","Consigne d’accès / référence utile"];
  return ["Document ou photo réellement utile à la mission, uniquement si nécessaire"];
}

function collectPreparation(){

 const contactChoice=b2b?(document.querySelector('input[name="contactChoice"]:checked')?.value||""):"OPTIONNEL";
 const docsChoice=document.querySelector('input[name="docsChoice"]:checked')?.value||"";

 if(b2b && !contactChoice)return alert("Choisissez NOM + TÉLÉPHONE ou AUCUN.");
 if(!docsChoice)return alert("Choisissez OUI — AJOUTER ou AUCUN DOCUMENT.");

 const contact=(document.getElementById('contact')?.value||"").trim();
 if(b2b && contactChoice==="CONTACT" && !contact)return alert("Renseignez le nom + téléphone du contact.");
 const map=(document.getElementById('map')?.value||"").trim();
 if(b2b && !map)return alert("B2B : localisation / lien Plans ou Maps obligatoire.");

 const files=[...(document.getElementById('docs')?.files||[])].map(f=>f.name);
 if(docsChoice==="OUI" && !files.length)return alert("Ajoutez au moins un document / une photo, ou choisissez AUCUN DOCUMENT.");

 let h={
   addr:document.getElementById('addr').value.trim(),
   access:document.getElementById('access').value,
   mode:document.getElementById('mode').value,
   contactChoice,
   contact:contactChoice==="AUCUN"?"AUCUN":contact,
   map,
   docsChoice,
   docs:files,
   note:(document.getElementById('note')?.value||"").trim()
 };
 if(!h.addr)return alert("Adresse exacte obligatoire.");

 S.prep=h;
 save();
 ready();
}

function docPack(){
  const m=S.result?.mission||"";
  let fiche="Fiche mission";
  let checklist="Checklist courte adaptée";
  let support="Aucun document supplémentaire";
  let rest=S.result?.rest||"R0";

  if(m==="DÉCIDER"){support="Cahier des charges validé";rest="R2"}
  else if(m==="SUIVRE"){support="Cahier des charges commun aux 3 passages";rest="R3 comparative"}
  else if(m==="PRÉSENCE PROJET"){support="Cahier des charges validé";rest="R2 B2B"}
  else if(m==="PRÉSENCE PROJET ÉTENDUE"){support="Objectif unique + brief validé";rest="R2 B2B"}
  else if(m==="CONTINUITÉ PROJET"){support="Cahier des charges commun aux 3 jalons";rest="R3 B2B"}
  else if(m==="VISITE TERRAIN PILOTÉE"){support="Brief / objectif validé";rest="R1 B2B"}
  else if(m.includes("APRÈS INTEMPÉRIE")){support="Sécurité / électricité";rest="R0-C"}
  else if(m.includes("VOIR")){support="Périmètre d’observation";rest="R1"}
  else if(m.includes("CLÉ / BADGE") || S.need==="KEY"){rest="R0-B"}
  else if(["ACCÈS B2B","PRÉSENCE LOGISTIQUE B2B","REMISE CLÉ / BADGE B2B","RÉCUPÉRATION CLÉ / BADGE B2B"].includes(m)){support="Consigne logistique";rest="R0 B2B"}

  return {fiche,checklist,support,rest};
}

  if(m==="RELAIS SIMPLE" && S.need==="DEL" && S.sub==="ACCESS")
    return ["Livreur / intervenant présent","Accès donné","CYRNEA a quitté les lieux après l’accès"];
  if(m==="RELAIS" && S.need==="DEL" && S.sub==="STAY")
    return ["Livreur / intervenant présent","Accès donné","CYRNEA est resté pendant le créneau convenu"];
  if(m==="RELAIS SIMPLE" && S.need==="THIRD")
    return ["Tiers autorisé présent","Identité vérifiée","Accès donné"];
  if(m==="RELAIS SIMPLE" && S.need==="KEY" && S.sub==="GIVE")
    return ["Personne désignée présente","Clé / badge remis","Heure de remise notée"];
  if(m==="RELAIS SIMPLE" && S.need==="KEY" && S.sub==="GET")
    return ["Personne désignée présente","Clé / badge récupéré","Heure de récupération notée"];
  if(m==="RELAIS" && S.need==="OPEN")
    return ["Bien ouvert","Actions simples convenues réalisées","Aucun ajout hors mission"];
  if(m.includes("AVANT INTEMPÉRIE"))
    return ["Éléments désignés fermés / rentrés","Actions prévues réalisées","Aucune action technique ajoutée"];
  if(m.includes("APRÈS INTEMPÉRIE"))
    return ["Contrôle visuel sécurité réalisé","Points pratiques convenus vérifiés","Aucune manipulation interdite réalisée"];
  if(m.includes("VOIR"))
    return ["Périmètre prévu observé","Photographies / vidéos utiles réalisées","Éléments non observables identifiés","Faits séparés des déclarations de tiers"];
  if(m==="DÉCIDER")
    return ["Points prévus observés","Questions convenues posées","Réponses attribuées aux interlocuteurs","Aucune recommandation donnée à la place du client"];
  if(m==="SUIVRE")
    return ["Même périmètre observé","Repères comparables utilisés","Écarts visibles documentés"];
  if(m==="VISITE TERRAIN PILOTÉE")
    return ["Site observé","Éléments utiles documentés","Aucune décision technique prise"];
  if(m==="PRÉSENCE PROJET")
    return ["Présence au rendez-vous / jalon","Questions prévues posées","Éléments factuels documentés","Aucune décision prise pour le client"];
  if(m==="PRÉSENCE PROJET ÉTENDUE")
    return ["Zones prévues parcourues","Interlocuteurs prévus rencontrés","Objectif unique respecté","Éléments factuels documentés"];
  if(m==="CONTINUITÉ PROJET")
    return ["Même périmètre / repères suivis","Évolution documentée","Comparaison avec passage précédent possible"];
  return ["Objet prévu exécuté","Éléments utiles documentés","Aucun élargissement de mission"];
}
function toggleIncidentOther(){
  const s=document.getElementById("incidentSelect"),w=document.getElementById("incidentOtherWrap");
  if(s&&w)w.classList.toggle("hidden",s.value!=="AUTRE");
}

function nowStamp(){
  const n=new Date();
  return `${pad2(n.getDate())}/${pad2(n.getMonth()+1)}/${n.getFullYear()} ${pad2(n.getHours())}:${pad2(n.getMinutes())}:${pad2(n.getSeconds())}`;
}
function markArrival(){
  if(!S.arrivalAt)S.arrivalAt=nowStamp();
  save();
  terrain();
}
function triggerDoubt(){
  const s=document.getElementById("incidentSelect");
  if(s)s.value="SITUATION DIFFÉRENTE / DOUTE";
  const z=document.getElementById("incidentZone");
  if(z)z.scrollIntoView({behavior:"smooth",block:"center"});
}
function terrainMediaNames(){
  return [...(document.getElementById("terrainMedia")?.files||[])].map(f=>f.name);
}
function allChecked(selector){
  const xs=[...document.querySelectorAll(selector)];
  return xs.length>0 && xs.every(x=>x.checked);
}
function continueMultiAfterRestitution(){
  const next=S.passage+1;
  const p=(S.multiSlots||[]).find(x=>x.index===next);
  if(!p){
    return draw(`<div class="card"><h1>Passage / jalon ${next} à programmer</h1>
      <div class="warn"><b>ARRÊT NORMAL</b>Le prochain créneau n’est pas fixé. Aucun passage suivant ne peut être lancé sans date, heure, contrôle d’agenda et éventuelle majoration.</div>
      <div class="notice">En pratique : créneau → disponibilité → réservation SimplyBook → préparation interne → mission prête.</div>
      <button class="btn ghost" onclick="archivePartialMulti()">QUITTER LE TEST ICI</button>
    </div>`);
  }
  S.passage=next;
  S.date=p.date;
  S.slot=p.time;
  S.arrivalAt="";
  S.departureAt="";
  S.facts="";
  S.incident="";
  S.terrainMedia=[];
  S.overrun=null;
  save();
  ready();
}
function archivePartialMulti(){
  save();
  draw(`<div class="card"><h1>Mission multi-passage conservée en cours</h1>
    <div class="row"><b>Référence</b><span>${esc(S.missionId)}</span></div>
    <div class="row"><b>Passage réalisé</b><span>${esc(String(S.passage))}</span></div>
    <div class="row"><b>Prochaine étape</b><span>Programmer le jalon suivant avant nouvelle intervention.</span></div>
    <button class="btn ghost" onclick="missionDesk()">RETOUR AU DOSSIER MISSION</button>
  </div>`);
}
function collectTerrain(){
  if(!S.arrivalAt)return alert("Appuyez d’abord sur J’ARRIVE SUR PLACE pour horodater le début de mission.");
  if(!allChecked("input[name='terrainGuard']"))return alert("Tous les garde-fous applicables doivent être vérifiés avant de quitter.");
  if(!allChecked("input[name='exitCheck']"))return alert("Effectuez les contrôles de sortie avant de quitter les lieux.");

  const facts=[...document.querySelectorAll("input[name='terrainFact']:checked")].map(x=>x.value);
  const other=(document.getElementById("factOther")?.value||"").trim();
  if(other)facts.push(other);
  if(!facts.length)return alert("Cochez au moins un fait / une action réellement réalisé(e) ou observé(e).");

  const inc=document.getElementById("incidentSelect").value;
  if(!inc)return alert("Choisissez la situation : AUCUN INCIDENT ou un incident / une limite.");
  let incText=inc;
  if(inc==="AUTRE"){
    incText=(document.getElementById("incidentOther")?.value||"").trim();
    if(!incText)return alert("Précisez l’incident / la limite.");
  }

  S.terrainMedia=terrainMediaNames();
  S.facts=facts.join(" ; ");
  S.incident=inc==="AUCUN"?"Aucun":incText;
  S.departureAt=nowStamp();
  save();
  restitution();
}

function needsWaitGuard(){
  return ["ART","DEL","THIRD","KEY","BLOG"].includes(S.need);
}

function overrunRule(){
 const m=baseMissionName(S.result?.mission||"");
 if(m==="RELAIS SIMPLE" || m.includes("APRÈS INTEMPÉRIE") || ["ACCÈS B2B","REMISE CLÉ / BADGE B2B","RÉCUPÉRATION CLÉ / BADGE B2B"].includes(m))
   return {allowed:false,text:"Cette mission n’a pas de prolongation horaire. Si le cadre prévu est dépassé, arrêtez et faites requalifier la demande avant toute action supplémentaire."};
 if(m==="RELAIS" || m.includes("AVANT INTEMPÉRIE"))
   return {allowed:true,unit:40,base:"TTC",max:2,label:"+40 € TTC par tranche de 30 min commencée, maximum 2 tranches"};
 if(m==="VOIR PRÉSENCE" || m==="VOIR RELAIS" || m==="DÉCIDER" || m==="SUIVRE")
   return {allowed:true,unit:60,base:"TTC",max:null,label:"+60 € TTC par tranche de 30 min commencée"};
 if(["VISITE TERRAIN PILOTÉE","PRÉSENCE PROJET","PRÉSENCE PROJET ÉTENDUE","CONTINUITÉ PROJET","PRÉSENCE LOGISTIQUE B2B"].includes(m))
   return {allowed:true,unit:75,base:"HT",max:null,label:"+75 € HT par tranche de 30 min commencée"};
 return {allowed:false,text:"Aucune prolongation automatique n’est prévue pour cette mission. Arrêtez et faites requalifier avant d’élargir le périmètre."};
}
function overrunGuide(){
 const r=overrunRule();
 if(!r.allowed){
   return draw(`<div class="card"><h1>Temps / cadre dépassé</h1>
     <div class="stop"><b>NE PAS CONTINUER AUTOMATIQUEMENT</b><br>${esc(r.text)}</div>
     <div class="readAloud">La mission prévue arrive à sa limite. Je dois faire confirmer la suite avant de continuer.</div>
     <button class="btn ghost" onclick="terrain()">RETOUR AU TERRAIN</button>
   </div>`);
 }
 const maxAttr=r.max?` max="${r.max}"`:"";
 draw(`<div class="card"><h1>Prolongation imprévue</h1>
   <div class="warn"><b>RÈGLE</b><br>${esc(r.label)}. Uniquement si l’objet reste exactement le même et après accord exprès du client.</div>
   <div class="field"><label>Nombre de tranches de 30 min commencées</label><input id="overrunN" type="number" min="1"${maxAttr} value="1"></div>
   <div class="readAloud">La mission nécessite une prolongation dans le même objet. Le supplément est de ${esc(r.unit+" € "+r.base)} par tranche de 30 minutes commencée. Souhaitez-vous expressément que je poursuive ?</div>
   <div class="toolbar"><button class="btn primary" onclick="saveOverrun(${r.unit},'${r.base}',${r.max||'null'})">ACCORD CLIENT OBTENU → ENREGISTRER</button><button class="btn ghost" onclick="terrain()">NE PAS PROLONGER</button></div>
 </div>`);
}
function saveOverrun(unit,base,max){
 const n=Math.max(1,Number(document.getElementById("overrunN")?.value||1));
 if(max && n>max) return alert("Maximum autorisé : "+max+" tranche(s). Au-delà : arrêt ou requalification.");
 S.overrun={tranches:n,unit,total:n*unit,base,passage:S.passage,accepted:true};
 save(); terrain();
}
function extraMomentRule(){
 const m=baseMissionName(S.result?.mission||"");
 if(m==="SUIVRE") return {unit:300,base:"TTC",name:"moment"};
 if(m==="CONTINUITÉ PROJET") return {unit:420,base:"HT",name:"jalon"};
 return null;
}
function extraMomentInfo(){
 const r=extraMomentRule();
 if(!r)return;
 const next=S.passage+1;
 if(next>5){
   return draw(`<div class="card"><h1>Passage supplémentaire</h1><div class="stop"><b>À PARTIR DU 6e</b><br>Devis, requalification ou refus si la demande devient récurrente. Ne pas lancer un nouveau passage automatiquement.</div><button class="btn ghost" onclick="restitution()">RETOUR</button></div>`);
 }
 draw(`<div class="card"><h1>${next}e ${esc(r.name)} lié</h1>
   <div class="notice"><b>SUPPLÉMENT</b>+${r.unit} € ${r.base} pour ce ${r.name}, même dossier et même objet.</div>
   <div class="readAloud">Un ${next}e ${r.name} est possible dans le même dossier et pour le même objet, avec un supplément de ${r.unit} € ${r.base}. Il devra être validé avant ce nouveau passage.</div>
   <div class="warn">Ne pas partir sur ce nouveau passage tant que le créneau, le supplément et la réservation / validation correspondante ne sont pas confirmés.</div>
   <button class="btn ghost" onclick="restitution()">RETOUR</button>
 </div>`);
}
function terrain(){
 setStage("TERRAIN");
 let rules=[];
 if(S.result.mission.includes("APRÈS INTEMPÉRIE"))rules=["Vérifier AVANT toute manipulation : pas d'eau","Pas d'humidité anormale","Pas d'odeur de brûlé","Pas d'échauffement","Pas de dommage visible","Un seul réarmement simple maximum si prévu"];
 else if(S.result.mission.includes("VOIR"))rules=["Observer uniquement le périmètre prévu","Séparer OBSERVÉ / DÉCLARÉ / DOCUMENT / NON VÉRIFIABLE","Aucun diagnostic / conformité / cause"];
 else if(S.result.mission==="DÉCIDER"||S.result.mission.includes("PRÉSENCE PROJET"))rules=["Suivre le cahier des charges","Poser uniquement les questions convenues","Aucune décision ou signature pour le client"];
 else rules=["Exécuter uniquement l'objet prévu","Ne pas élargir la mission","Documenter uniquement les preuves utiles"];
 if(needsWaitGuard())rules.push("Si tiers / professionnel absent ou en retard : attente incident maximum 15 minutes");

 const facts=terrainFactOptions();

 draw(`<div class="card"><h1>Sur place — passage ${S.passage}</h1><div class="operatorOnly">Suivez l’ordre : arrivée → contrôles → actions prévues → preuves utiles → contrôle de sortie. Si la situation diffère, n’improvisez pas.</div>
 <div class="todo"><b>À FAIRE SUR PLACE</b>Cochez uniquement ce que vous avez réellement vérifié, fait ou observé. Les coches servent directement à fabriquer la restitution.</div>
 ${S.arrivalAt
   ? `<div class="notice"><b>ARRIVÉE HORODATÉE</b>${esc(S.arrivalAt)}</div>`
   : `<button class="btn primary" onclick="markArrival()">J’ARRIVE SUR PLACE — HORODATER</button>`}
 <div class="advice"><b>CONSEIL</b>Les cases ci-dessous sont vos contrôles internes. Le client n’a rien à cocher ici.</div>

 <div class="row"><b>${esc(S.missionId)}</b><span>${esc(S.result.mission)}</span></div>
 <div class="toolbar"><button class="btn ghost" onclick="missionDesk()">DOSSIER MISSION</button></div>

 <div class="checkZone">
   <div class="checkIntro">GARDE-FOUS À COCHER</div>
   ${rules.map(x=>`<label class="check"><input type="checkbox" name="terrainGuard"> <span>J’ai vérifié / appliqué : <b>${esc(x)}</b></span></label>`).join("")}
 </div>

 <div class="checkZone">
   <div class="checkIntro">FAITS / ACTIONS UTILES — PLUSIEURS CHOIX POSSIBLES</div>
   ${facts.map(x=>`<label class="check"><input type="checkbox" name="terrainFact" value="${esc(x)}"> <span>${esc(x)}</span></label>`).join("")}
   <button class="btn ghost" onclick="document.getElementById('factOtherWrap').classList.toggle('hidden')">+ AUTRE FAIT — EXCEPTION</button>
   <div class="field hidden" id="factOtherWrap"><label>Autre fait — quelques mots</label><input id="factOther" maxlength="140" placeholder="Uniquement si aucune case ne convient."></div>
 </div>

 <div class="field">
   <label>PHOTOS / PREUVES TERRAIN (SI UTILES)</label>
   <input id="terrainMedia" type="file" accept="image/*,video/*,.pdf" capture="environment" multiple>
   <div class="muted">Sur iPhone : prendre directement une photo/vidéo ou choisir une pièce existante. Le prototype mémorise seulement les noms ; la production devra stocker les fichiers réels.</div>
 </div>

 <div class="field" id="incidentZone">
   <label>INCIDENT / LIMITE ÉVENTUEL — UN CHOIX PRINCIPAL</label>
   <select id="incidentSelect" onchange="toggleIncidentOther()">
     <option value="">— Choisir —</option>
     <option value="AUCUN">AUCUN INCIDENT / AUCUNE LIMITE</option>
     <option value="Tiers / professionnel absent">Tiers / professionnel absent</option>
     <option value="Accès impossible ou partiel">Accès impossible ou partiel</option>
     <option value="Retard important du tiers / professionnel">Retard important du tiers / professionnel</option>
     <option value="Demande nouvelle hors mission">Demande nouvelle hors mission</option>
     <option value="Information indispensable manquante">Information indispensable manquante</option>
     <option value="Situation de sécurité / danger">Situation de sécurité / danger</option>
     <option value="SITUATION DIFFÉRENTE / DOUTE">SITUATION DIFFÉRENTE / J’AI UN DOUTE</option>
     <option value="Élément prévu non observable / non vérifiable">Élément prévu non observable / non vérifiable</option>
     <option value="AUTRE">AUTRE — à préciser</option>
   </select>
 </div>
 <div class="field hidden" id="incidentOtherWrap">
   <label>Précisez l’incident / la limite</label>
   <textarea id="incidentOther" placeholder="Décrire uniquement le fait constaté, sans interprétation."></textarea>
 </div>

 <div class="stop"><b>LA SITUATION EST DIFFÉRENTE / J'AI UN DOUTE</b><br>Ne pas improviser · constater · ne pas aggraver · documenter · requalifier avant élargissement.<br><br><button class="btn danger" onclick="triggerDoubt()">J’AI UN DOUTE / SITUATION DIFFÉRENTE</button></div>
 <div class="warn"><b>LE TEMPS PRÉVU EST DÉPASSÉ ?</b><br>Ne prolongez jamais de vous-même. L’assistant applique la règle de la mission.<br><br><button class="btn ghost" onclick="overrunGuide()">TEMPS / CADRE DÉPASSÉ</button>${S.overrun?.accepted?`<div class="notice" style="margin-top:10px"><b>PROLONGATION ACCEPTÉE</b>+${esc(String(S.overrun.total))} € ${esc(S.overrun.base)} — ${esc(String(S.overrun.tranches))} tranche(s).</div>`:""}</div>

 <div class="checkZone">
   <div class="checkIntro">AVANT DE QUITTER LES LIEUX — CONTRÔLES CRITIQUES</div>
   <label class="check"><input type="checkbox" name="exitCheck"><span>Accès / clés / badge laissés conformément à la mission</span></label>
   <label class="check"><input type="checkbox" name="exitCheck"><span>Portes / ouvrants / équipements simples laissés dans l’état prévu</span></label>
   <label class="check"><input type="checkbox" name="exitCheck"><span>Tiers / professionnel : situation connue ou incident documenté si applicable</span></label>
   <label class="check"><input type="checkbox" name="exitCheck"><span>Preuves utiles / photos nécessaires prises ou absence justifiée</span></label>
 </div>

 <button class="btn primary" onclick="collectTerrain()">J’AI TERMINÉ SUR PLACE</button>
 </div>`)
}
function restitution(){
 setStage("RESTITUTION");
 const interim=S.result.multi&&S.passage<3;
 draw(`<div class="card"><h1>${interim?"Restitution intermédiaire":"Restitution finale"}</h1><div class="operatorOnly">Décrivez uniquement ce qui a été vu, fait, dit ou impossible à vérifier. Pas d’interprétation technique.</div>
 <div class="row"><b>Référence</b><span>${esc(S.missionId)}</span></div>
 <div class="row"><b>Passage</b><span>${esc(String(S.passage))}</span></div>
 <div class="row"><b>Objet</b><span>${esc(S.obj)}</span></div>
 <div class="row"><b>Arrivée</b><span>${esc(S.arrivalAt||"-")}</span></div>
 <div class="row"><b>Départ</b><span>${esc(S.departureAt||"-")}</span></div>
 <div class="row"><b>Faits/actions</b><span>${esc(S.facts||"À compléter")}</span></div>
 <div class="row"><b>Incident/limite</b><span>${esc(S.incident||"Aucun")}</span></div>
 ${S.overrun?.accepted?`<div class="row"><b>Prolongation</b><span>+${esc(String(S.overrun.total))} € ${esc(S.overrun.base)} — ${esc(String(S.overrun.tranches))} tranche(s) de 30 min</span></div>`:""}
 <div class="row"><b>Médias / preuves</b><span>${S.terrainMedia.length?esc(S.terrainMedia.join(" • ")):"AUCUN FICHIER AJOUTÉ"}</span></div>
 <div class="notice">En production : générer le bon modèle R0/R1/R2/R3, PDF contrôlé, sans ressaisie des données déjà connues.</div>
 ${interim
   ? `<button class="btn primary" onclick="continueMultiAfterRestitution()">ENREGISTRER L’INTERMÉDIAIRE ET PRÉPARER LE PASSAGE ${S.passage+1}</button>`
   : `<button class="btn primary" onclick="closeMission()">VALIDER LA RESTITUTION FINALE</button>${S.result.multi&&S.passage>=3?`<button class="btn ghost" onclick="extraMomentInfo()" style="margin-top:10px">UN 4e / 5e PASSAGE LIÉ EST ENVISAGÉ</button>`:""}`}
 </div>`);
 save();
}
function closeMission(){
 if(!S.departureAt)return alert("Impossible de clôturer sans contrôle terrain terminé et heure de départ.");
 setStage("CLÔTURE");
 draw(`<div class="card"><h1>Clôture</h1>
 <div class="todo"><b>À FAIRE</b>Choisir le statut réel. Ne jamais sélectionner « réalisée » si une partie prévue n’a pas pu être exécutée.</div>
 <div class="row"><b>Arrivée</b><span>${esc(S.arrivalAt)}</span></div>
 <div class="row"><b>Départ</b><span>${esc(S.departureAt)}</span></div>
 <div class="row"><b>Incident</b><span>${esc(S.incident||"Aucun")}</span></div>
 <div class="field"><label>Statut final</label><select id="fs">
   <option>MISSION RÉALISÉE ET CLÔTURÉE</option>
   <option>MISSION PARTIELLEMENT RÉALISÉE ET CLÔTURÉE</option>
   <option>MISSION IMPOSSIBLE À RÉALISER - CLÔTURÉE AVEC MOTIF DOCUMENTÉ</option>
 </select></div>
 <div class="notice">${S.result.contract.startsWith("PRÉSENCE")?"H5 / restitution finale à envoyer.":"Restitution RELAIS à envoyer."}</div>
 <button class="btn primary" onclick="S.finalStatus=document.getElementById('fs').value;save();archive()">ARCHIVER LE DOSSIER</button>
 </div>`);
}
function archive(){setStage("ARCHIVE");save();draw(`<div class="card"><h1>Mission archivée</h1><div class="row"><b>Référence</b><span>${esc(S.missionId)}</span></div><div class="row"><b>Mission</b><span>${esc(S.result.mission)}</span></div><div class="row"><b>Statut</b><span>${esc(S.finalStatus)}</span></div><div class="row"><b>Archive cible</b><span>iCloud Drive / CYRNEA / MISSIONS / ${esc(S.result.contract==="RELAIS"?"RELAIS":"PRÉSENCE")} / ${esc(S.missionId)}</span></div><div class="notice">Mission terminée : appel → préparation → terrain → restitution → clôture.<br><br><b>En production, aucun fichier technique ne sera à télécharger :</b> le dossier mission sera classé automatiquement dans l’archive CYRNEA. Sur le terrain, vous travaillez depuis l’assistant ; l’archive iCloud reste le stockage de fond, pas l’interface de travail.</div><div class="toolbar"><button class="btn ghost" onclick="newMission()">NOUVELLE MISSION</button></div></div>`)}
function exportJSON(){let b=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});let a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=(S.missionId||"CYRNEA-DEMO")+".json";a.click();URL.revokeObjectURL(a.href)}
function boot(){
 try{STAGE_VIEWS=JSON.parse(localStorage.getItem(STAGE_VIEWS_KEY)||"{}")||{}}catch(e){STAGE_VIEWS={}}
 const raw=localStorage.getItem(STATE_KEY)||localStorage.getItem(LEGACY_STATE_KEY);
 if(raw){
   try{
     const p=JSON.parse(raw);
     S={...S,...p,prep:{...(p.prep||{})},multiSlots:Array.isArray(p.multiSlots)?p.multiSlots:[],availability:{...(p.availability||{})},overrun:p.overrun||null,specialPending:false,resumeStage:p.resumeStage||""};
     if(p.specialPending && S.result) S.acceptedSlot=true;
     if(S.result && (S.result.mission==="VOIR RELAIS" || S.result.mission==="VOIR PRIORITAIRE RELAIS")){
       S.result.contract="PRÉSENCE PROPRIÉTAIRES"; S.result.rest="R1";
       S.result.mission=S.result.mission.includes("PRIORITAIRE")?"VOIR PRIORITAIRE":"VOIR PRÉSENCE";
     }
     if(!Array.isArray(S.history))S.history=["ACCUEIL"];
     REACHED_STAGES=new Set(S.history); REACHED_STAGES.add("ACCUEIL"); syncReached();
     if(S.stage && S.stage!=="ACCUEIL") S.resumeStage=S.stage;
     save();
   }catch(e){}
 }
 REACHED_STAGES=new Set(Array.isArray(S.history)?S.history:["ACCUEIL"]);REACHED_STAGES.add("ACCUEIL");syncReached(); NAV=[]; LAST_VIEW=null; drawTimeline(); home(false); updateBack();
}
boot();
</script>

<script>
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
}
</script>
