function esc(x){return String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}

function normalizeFrenchPhone(raw){
  let d=String(raw||'').replace(/\D/g,'');
  if(d.startsWith('0033')) d=d.slice(4);
  else if(d.startsWith('33')) d=d.slice(2);
  if(d.startsWith('0')) d=d.slice(1);
  if(d.length===9){
    return '+33 '+d[0]+' '+d.slice(1).match(/.{1,2}/g).join(' ');
  }
  return String(raw||'').trim();
}
function formatFrenchPhoneTyping(raw){
  let d=String(raw||'').replace(/\D/g,'');
  if(d.startsWith('0033')) d='0'+d.slice(4);
  else if(d.startsWith('33') && d.length>2) d='0'+d.slice(2);
  d=d.slice(0,10);
  return (d.match(/.{1,2}/g)||[]).join(' ');
}
function formatPhoneInput(el){
  if(!el)return;
  const country=document.getElementById('phoneCountry')?.value||'+33';
  if(country==='+33') el.value=formatFrenchPhoneTyping(el.value);
}
function refreshPhoneFormat(){

let STAGE_VIEWS={};

function serializeAppHtml(){
 const app=document.getElementById("app"); if(!app)return "";
 const c=app.cloneNode(true);
 [...app.querySelectorAll("input,select,textarea")].forEach((src,i)=>{const dst=c.querySelectorAll("input,select,textarea")[i];if(!dst)return;if(src.tagName==="INPUT"){dst.setAttribute("value",src.value);if(src.checked)dst.setAttribute("checked","");else dst.removeAttribute("checked");}else if(src.tagName==="SELECT"){[...dst.options].forEach((o,j)=>{if(j===src.selectedIndex)o.setAttribute("selected","");else o.removeAttribute("selected")});}else dst.textContent=src.value;});
 return c.innerHTML;
}
function syncReached(){S.history=STATES.filter(x=>REACHED_STAGES.has(x))}
function setStage(st){S.stage=st;REACHED_STAGES.add(st);syncReached();document.getElementById("status").textContent=st;drawTimeline()}

function snapshot(){return {s:JSON.stringify(S),html:serializeAppHtml(),status:document.getElementById("status").textContent,timeline:document.getElementById("timeline").innerHTML}}
function cloneView(v){return v?{s:v.s,html:v.html,status:v.status,timeline:v.timeline}:null}
function saveStageViews(){try{localStorage.setItem(STAGE_VIEWS_KEY,JSON.stringify(STAGE_VIEWS))}catch(e){}}
function storeCurrentStageView(){if(!LAST_VIEW)return;let oldStage="";try{oldStage=JSON.parse(LAST_VIEW.s||"{}").stage||LAST_VIEW.status}catch(e){oldStage=LAST_VIEW.status}if(!oldStage)return;const temp={...S,stage:oldStage};const v={s:JSON.stringify(temp),html:serializeAppHtml(),status:LAST_VIEW.status||oldStage,timeline:document.getElementById("timeline").innerHTML};STAGE_VIEWS[oldStage]=cloneView(v);LAST_VIEW=cloneView(v);saveStageViews()}
function restoreView(snap){if(!snap)return false;const restored=JSON.parse(snap.s);(restored.history||[]).forEach(x=>REACHED_STAGES.add(x));S=restored;syncReached();document.getElementById("app").innerHTML=snap.html;document.getElementById("status").textContent=snap.status;LAST_VIEW=cloneView(snap);drawTimeline();updateBack();save();window.scrollTo({top:0,behavior:"instant"});return true}
function draw(x,remember=true){
 const app=document.getElementById("app");
 if(remember&&LAST_VIEW&&LAST_VIEW.html.trim()){storeCurrentStageView();NAV.push(cloneView(LAST_VIEW));}
 app.innerHTML=x;

 updateBack(); drawTimeline();
 window.scrollTo({top:0,behavior:"instant"});
}
function backStep(){

 storeCurrentStageView();
 const snap=NAV.pop();
 restoreView(snap);
}
function gotoStage(st){
 if(!REACHED_STAGES.has(st))return;
 if(st===S.stage)return;
 const fromStage=S.stage;
 storeCurrentStageView();
 if(LAST_VIEW&&LAST_VIEW.html.trim())NAV.push(cloneView(LAST_VIEW));
 if(st==="ACCUEIL"){ if(fromStage!=="ACCUEIL") S.resumeStage=fromStage; save(); return home(false); }
 const snap=STAGE_VIEWS[st];
 if(snap)return restoreView(snap);
 if(st==="QUALIFICATION")return identify();
 if(st==="CADRAGE")return S.result?showResult():needs();
 if(st==="CRÉNEAU")return slot();
 if(st==="RÉSERVATION"){

 if(st==="ARCHIVE")return archive();
}

function activeMissionKey(st=S){return String(st?.missionId||st?.draftKey||"")}
function isActiveMissionState(st=S){
 return !!(st && st.result && String(st.result.mission||"").trim() && String(st.result.contract||"").trim() && !st.finalStatus && st.stage!=="ARCHIVE");
}
function isStoredMissionState(st=S){
 return !!(st && activeMissionKey(st) && st.result && String(st.result.mission||"").trim() && String(st.result.contract||"").trim());
}
function loadActiveMissionMap(){
 try{const x=JSON.parse(localStorage.getItem(ACTIVE_MISSIONS_KEY)||"{}");return x&&typeof x==="object"&&!Array.isArray(x)?x:{}}catch(e){return {}}
}
function writeActiveMissionMap(map){localStorage.setItem(ACTIVE_MISSIONS_KEY,JSON.stringify(map||{}))}

 if(!isStoredMissionState(st))return;
 const id=activeMissionKey(st);

 const map=loadActiveMissionMap();
 map[id]=JSON.parse(JSON.stringify(st));
 writeActiveMissionMap(map);
}
function removeActiveSnapshot(st=S){
 const id=activeMissionKey(st);

 const map=loadActiveMissionMap();

function activeMissionList(){

 return Object.entries(map).map(([id,state])=>({id,state})).filter(x=>isActiveMissionState(x.state)).sort((a,b)=>String(a.state.date||"9999").localeCompare(String(b.state.date||"9999"))||String(a.state.slot||"99:99").localeCompare(String(b.state.slot||"99:99")));
}
function archivedMissionList(){
 const map=loadActiveMissionMap();
 return Object.entries(map)
   .map(([id,state])=>({id,state}))
   .filter(x=>isStoredMissionState(x.state) && (!!x.state.finalStatus || x.state.stage==="ARCHIVE"))
   .sort((a,b)=>(Number(b.state._localUpdatedAt||0)-Number(a.state._localUpdatedAt||0)) || String(b.state.date||"").localeCompare(String(a.state.date||"")));

async function syncCentralMissions(options={}){
 const key=getSyncKey();
 if(!key)throw new Error("sync_key_missing");

 // Une seule requête globale pour Safari/iPhone et Mac.
 const body={
   key,
   missions:localDirtyMissionArray(),
   deleted_ids:loadDeletedIds()
 };

 const controller=new AbortController();
 const timeout=setTimeout(()=>controller.abort(),12000);
 let res;
 try{
   res=await fetch(MISSIONS_API_URL+"/sync",{
     method:"POST",
     headers:{"Content-Type":"text/plain;charset=UTF-8"},
     cache:"no-store",
     credentials:"omit",
     signal:controller.signal,
     body:JSON.stringify(body)
   });
 }finally{
   clearTimeout(timeout);
 }

 let data=null;
 try{data=await res.json()}catch(e){}
 if(!res.ok||!data?.ok){
   throw new Error(String(data?.error||("sync_http_"+res.status)));
 }

 const finalMap={};
 for(const item of (Array.isArray(data.missions)?data.missions:[])){
   if(!item||typeof item!=="object")continue;
   const id=String(item.id||activeMissionKey(item)||item.missionId||item.draftKey||"");
   if(!id)continue;
   const st=JSON.parse(JSON.stringify(item));
   delete st.id;
   delete st._serverUpdatedAt;
   finalMap[id]=st;
 }
 writeActiveMissionMap(finalMap);

 // Les modifications/suppressions envoyées ont été accusées réception par le Worker.
 writeDeletedIds([]);
 writeDirtyIds([]);

 const currentId=activeMissionKey(S);
 if(currentId && finalMap[currentId]){
   S=JSON.parse(JSON.stringify(finalMap[currentId]));
   localStorage.setItem(STATE_KEY,JSON.stringify(S));
 }else if(currentId && !finalMap[currentId]){
   localStorage.removeItem(STATE_KEY);
   localStorage.removeItem(STAGE_VIEWS_KEY);
 }

 return {
   ok:true,
   received:Number(data.received||0),
   count:Object.keys(finalMap).length
 };
}

function parseEuroAmount(v){
  const s=String(v||"").replace(/\u00a0/g," ").replace(/\s/g,"").replace(",",".");
  const m=s.match(/(\d+(?:\.\d+)?)/);
  return m?Number(m[1]):null;

function priceParts(){

  const ht=amount, vat=Math.round((ht*VAT_RATE+Number.EPSILON)*100)/100, ttc=Math.round((ht+vat+Number.EPSILON)*100)/100;
  return {b2b:true,raw,ht,vat,ttc};
}

function refreshTimeDropdownAvailability(dateId,baseId){
  const d=document.getElementById(dateId);
  const h=document.getElementById(baseId+"H");
  const m=document.getElementById(baseId+"M");
  if(!d||!h||!m)return;

  const allHours=String(h.dataset.hours||"").split(",").filter(Boolean);
  const allMinutes=String(m.dataset.minutes||"").split(",").filter(Boolean);
  const previousHour=String(h.value||"");
  const previousMinute=String(m.value||"");
  const selectedDate=String(d.value||"");
  const today=todayLocalISO();
  const next=nextQuarterInfo();

  let visibleHours=allHours.slice();
  if(selectedDate===today){
    if(next.date!==today){
      visibleHours=[];
    }else{
      const minHour=Number(next.time.slice(0,2));
      visibleHours=visibleHours.filter(x=>Number(x)>=minHour);
    }
  }

  h.innerHTML='<option value="">Heure</option>'+visibleHours.map(x=>`<option value="${x}">${x}</option>`).join("");
  if(visibleHours.includes(previousHour))h.value=previousHour;

  let visibleMinutes=allMinutes.slice();
  const chosenHour=String(h.value||"");
  if(selectedDate===today && chosenHour){
    if(next.date!==today){
      visibleMinutes=[];
    }else{
      const minHour=Number(next.time.slice(0,2));
      const minMinute=Number(next.time.slice(3,5));
      const hh=Number(chosenHour);
      if(hh<minHour)visibleMinutes=[];
      else if(hh===minHour)visibleMinutes=visibleMinutes.filter(x=>Number(x)>=minMinute);
    }
  }

  m.innerHTML='<option value="">Minutes</option>'+visibleMinutes.map(x=>`<option value="${x}">${x}</option>`).join("");
  if(visibleMinutes.includes(previousMinute))m.value=previousMinute;

  syncTimeDropdown(baseId);
}
function displayTime4(v){

function todayLocalISO(){
  const n=new Date();
  return `${n.getFullYear()}-${pad2(n.getMonth()+1)}-${pad2(n.getDate())}`;
}
function currentLocalHM(){
  const n=new Date();
  return `${pad2(n.getHours())}:${pad2(n.getMinutes())}`;
}
function easterSunday(year){
  // Meeus/Jones/Butcher Gregorian algorithm.
  const a=year%19, b=Math.floor(year/100), c=year%100;
  const d=Math.floor(b/4), e=b%4, f=Math.floor((b+8)/25);
  const g=Math.floor((b-f+1)/3), h=(19*a+b-d-g+15)%30;
  const i=Math.floor(c/4), k=c%4, l=(32+2*e+2*i-h-k)%7;
  const m=Math.floor((a+11*h+22*l)/451);
  const month=Math.floor((h+l-7*m+114)/31);
  const day=((h+l-7*m+114)%31)+1;
  return new Date(year,month-1,day,12,0,0,0);
}
function addDays(d,n){
  const x=new Date(d.getTime()); x.setDate(x.getDate()+n); return x;
}
function isoOfDate(d){
  return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
}
function isFrenchPublicHoliday(dateStr){
  if(!dateStr) return false;
  const [y,m,d]=dateStr.split("-").map(Number);
  const fixed=new Set([
    `${y}-01-01`,`${y}-05-01`,`${y}-05-08`,`${y}-07-14`,
    `${y}-08-15`,`${y}-11-01`,`${y}-11-11`,`${y}-12-25`
  ]);
  if(fixed.has(dateStr)) return true;
  const easter=easterSunday(y);
  const movable=new Set([
    isoOfDate(addDays(easter,1)),   // lundi de Pâques
    isoOfDate(addDays(easter,39)),  // Ascension
    isoOfDate(addDays(easter,50))   // lundi de Pentecôte
  ]);
  return movable.has(dateStr);
}
function localDateTime(dateStr,timeStr){
  if(!dateStr||!timeStr) return null;
  const [y,m,d]=dateStr.split("-").map(Number);
  const [hh,mm]=timeStr.split(":").map(Number);
  return new Date(y,m-1,d,hh,mm,0,0);
}
function isQuarterHour(timeStr){
  const m=String(timeStr||"").match(/^(\d{2}):(\d{2})$/);
  if(!m)return false;
  const hh=Number(m[1]), mm=Number(m[2]);
  return hh>=0&&hh<=23&&mm>=0&&mm<=59&&mm%15===0;
}
function nextQuarterInfo(){
  const n=new Date();
  const q=new Date(n);
  q.setSeconds(0,0);
  const add=(15-(q.getMinutes()%15))%15;
  q.setMinutes(q.getMinutes()+add);
  if(q.getTime()<=n.getTime())q.setMinutes(q.getMinutes()+15);
  return {
    date:`${q.getFullYear()}-${pad2(q.getMonth()+1)}-${pad2(q.getDate())}`,
    time:`${pad2(q.getHours())}:${pad2(q.getMinutes())}`
  };
}
function nightAllowedForMission(mission){
  const m=baseMissionName(String(mission||""));
  return ["PRÉSENCE PROJET","PRÉSENCE PROJET ÉTENDUE","CONTINUITÉ PROJET"].includes(m);
}
function validateFutureSlot(dateStr,timeStr,label="créneau"){
  const normalized=normalizeTime4(timeStr);
  if(!/^\d{2}:\d{2}$/.test(normalized)) return {ok:false,msg:`Heure invalide pour ${label}. Utilisez le format HH:MM.`};
  if(!isQuarterHour(normalized)) return {ok:false,msg:`Heure invalide pour ${label}. Choisissez 00, 15, 30 ou 45 minutes.`};
  timeStr=normalized;
  const dt=localDateTime(dateStr,timeStr);
  if(!dt) return {ok:false,msg:`Date et heure requises pour ${label}.`};
  const now=new Date();
  if(dt.getTime()<=now.getTime()){
    return {ok:false,msg:`Impossible de fixer ${label} dans le passé. Choisissez une date et une heure postérieures à maintenant.`};
  }
  return {ok:true,dt};
}
function validateMissionTimeRules(dateStr,timeStr,label="créneau"){
  const check=validateFutureSlot(dateStr,timeStr,label);
  if(!check.ok)return check;
  const contract=S.result?.contract||"";
  const isB2B=contract==="PRÉSENCE ENTREPRISES" || S.caller==="B2B";
  const isOwnerPresence=contract==="PRÉSENCE PROPRIÉTAIRES";
  const projectNightOpen=isB2B && nightAllowedForMission(S.result?.mission);
  const hour=check.dt.getHours();

  if(isOwnerPresence && (hour<8 || hour>=21)){
    return {ok:false,msg:"PRÉSENCE Propriétaires : départ possible de 08 h 00 à 20 h 45. Aucun nouveau départ à partir de 21 h."};
  }
  if(!isOwnerPresence && !projectNightOpen && (hour<8 || hour>=19)){
    return {ok:false,msg:"Ce type de mission : départ possible uniquement entre 08 h 00 et 18 h 45. Aucun nouveau départ à partir de 19 h. Une mission déjà commencée peut toutefois se terminer ou être prolongée selon la règle terrain."};
  }

  const c=autoConstraints(dateStr,timeStr);
  const horsStandard=!!S.result?.isQuote || c.priority || c.evening || c.night || c.sunday;
  if(!horsStandard && !["00","30"].includes(String(timeStr||"").slice(3,5))){
    return {ok:false,msg:"Créneau STANDARD : choisissez 00 ou 30 minutes. Les quarts d’heure 15 et 45 restent disponibles uniquement en HORS STANDARD."};
  }
  return check;
}
function autoConstraints(dateStr,timeStr){
  const dt=localDateTime(dateStr,timeStr);
  if(!dt) return {priority:false,evening:false,night:false,sunday:false};
  const now=new Date();
  const diff=dt.getTime()-now.getTime();
  const priority=diff>0 && diff<24*60*60*1000;
  const hour=dt.getHours();
  const contract=S.result?.contract||"";
  const isB2B=contract==="PRÉSENCE ENTREPRISES" || S.caller==="B2B";
  const isOwnerPresence=contract==="PRÉSENCE PROPRIÉTAIRES";
  const projectNightOpen=isB2B && nightAllowedForMission(S.result?.mission);
  const evening=(isOwnerPresence || projectNightOpen) && hour>=19 && hour<21;
  // Pour les missions B2B H24, la nuit couvre 21 h 00–07 h 59.
  const night=projectNightOpen && (hour>=21 || hour<8);
  const sunday=dt.getDay()===0 || isFrenchPublicHoliday(dateStr);
  return {priority,evening,night,sunday};
}
function setAutoConstraint(prefix,dateId,timeId){
  const date=document.getElementById(dateId)?.value||"";
  const time=getDropdownTime(timeId) || document.getElementById(timeId)?.value || "";

  const e=document.getElementById(`evening${prefix}`);
  const n=document.getElementById(`night${prefix}`);
  const sh=document.getElementById(`sunholiday${prefix}`);
  if(p){p.checked=c.priority;p.disabled=true}
  if(e){e.checked=c.evening;e.disabled=true}
  if(n){n.checked=c.night;n.disabled=true}
  if(sh){sh.checked=c.sunday;sh.disabled=true}
}
function refreshCalendarConstraints(){
  const today=todayLocalISO();
  const pairs=[
    ["d","sl",""],
    ["d1","sl1","_1"],
    ["d2","sl2","_2"],
    ["d3","sl3","_3"]
  ];
  pairs.forEach(([dId,tId,prefix])=>{
    const d=document.getElementById(dId), t=document.getElementById(tId);
    if(!d||!t) return;
    d.min=today;
    if(d.value && d.value<today)d.value="";
    // Pour aujourd'hui, ne jamais proposer une heure ou une minute déjà passée.
    // Pour une date future, la plage complète autorisée par l'univers réapparaît.
    refreshTimeDropdownAvailability(dId,tId);
    setAutoConstraint(prefix,dId,tId);
  });
}

  const m=baseMissionName(S.result.mission);
  const passages=[1,2,3].map(readMultiPassage).filter(Boolean);
  for(const p of passages){

    if(!check.ok) return alert(check.msg);
  }
  if(!passages.length) return alert("Le premier passage / jalon doit être renseigné.");

  if(S.result.isQuote){
    passages.forEach(p=>{
      p.surcharge=0;
      p.label=p.sunday?"Dimanche / jour férié":p.night?"Nuit à partir de 21 h":p.priority?"Prioritaire sous 24 h":p.evening?"Soir 19 h–20 h 59":"Standard";
    });

    S.slot=passages[0].time;
    S.availability={multi:true};
    S.result.availabilityLabel="Selon devis accepté — contraintes intégrées au devis";

    save();
    return bookingHandoff();
  }

  let base=0, unitPriority=0, unitSunday=0, suffix="";
  if(m==="SUIVRE"){
    base=980; unitPriority=90; unitSunday=120; suffix="€ TTC";
  } else if(m==="CONTINUITÉ PROJET"){
    base=1190; unitPriority=120; unitSunday=180; suffix="€ HT";
  } else {
    return alert("Cette fonction multi-passage ne s'applique pas à cette mission.");
  }

  let total=base;
  passages.forEach(p=>{
    let add=0,label="Standard";
    if(p.priority){add=unitPriority;label="Prioritaire sous 24 h";}
    if(p.evening){add=unitPriority;label="Soir 19 h–20 h 59";}
    if(m==="CONTINUITÉ PROJET" && p.night){add=unitSunday;label="Nuit à partir de 21 h";}
    if(p.sunday){add=unitSunday;label="Dimanche / jour férié";}
    p.surcharge=add;
    p.label=label;
    total+=add;
  });

  S.multiSlots=passages;
  S.date=passages[0].date;
  S.slot=passages[0].time;
  S.availability={multi:true};
  S.result.price=total.toLocaleString("fr-FR")+" "+suffix;
  S.result.availabilityLabel=passages.length===1
    ? "1er passage / jalon connu — suivants à programmer"
    : `${passages.length} passages / jalons tarifés individuellement`;
  S.acceptedSlot=true;
  save();
  bookingHandoff();

function availabilityPricing(){

  const priority=!!automatic.priority;
  const evening=!!automatic.evening;
  const night=!!automatic.night;
  const sunday=!!automatic.sunday;

  }
  if(m==="LOGISTIQUE / ACCÈS B2B" || String(S.result.price).includes("À CHIFFRER")) return;

  if(["ACCÈS B2B","REMISE CLÉ / BADGE B2B","RÉCUPÉRATION CLÉ / BADGE B2B","PRÉSENCE LOGISTIQUE B2B"].includes(m)){
    const base=(m==="PRÉSENCE LOGISTIQUE B2B")?169:109;
    const add=sunday?60:priority?40:0;
    S.result.price=(base+add)+" € HT";
    S.result.availabilityLabel=sunday?"Dimanche / jour férié":priority?"Prioritaire sous 24 h":"Standard";
    return;
  }

  if(m==="RELAIS SIMPLE" || m==="RELAIS" || m.includes("INTEMPÉRIE")){
    const base=(m==="RELAIS SIMPLE"||m.includes("APRÈS INTEMPÉRIE"))?109:169;
    const add=sunday?60:priority?40:0;
    S.result.price=(base+add)+" € TTC";
    S.result.availabilityLabel=sunday?"Dimanche / jour férié":priority?"Prioritaire sous 24 h":"Standard";
    return;
  }

  if(m==="VOIR RELAIS"){
    let price=260,label="Standard";
    if(priority||evening){price=350;label=evening?"Soir 19 h–20 h 59":"Prioritaire sous 24 h";}
    if(sunday){price=380;label="Dimanche / jour férié";}
    S.result.price=price+" € TTC";
    S.result.mission=priority?"VOIR PRIORITAIRE RELAIS":"VOIR RELAIS";
    S.result.availabilityLabel=label;
    return;
  }
  if(m==="VOIR PRÉSENCE"){
    let price=260,label="Standard";
    if(priority){price=350;label="Prioritaire sous 24 h";}
    if(sunday){price=380;label="Dimanche / jour férié";}
    S.result.price=price+" € TTC";
    S.result.mission=priority?"VOIR PRIORITAIRE":"VOIR PRÉSENCE";
    S.result.availabilityLabel=label;
    return;
  }
  if(m==="DÉCIDER"){
    let price=480,label="Standard";
    if(priority||evening){price=570;label=evening?"Soir 19 h–20 h 59":"Prioritaire sous 24 h";}
    if(sunday){price=600;label="Dimanche / jour férié";}
    S.result.price=price+" € TTC"; S.result.availabilityLabel=label; return;
  }
  if(m==="SUIVRE"){
    let add=0,label="Standard";
    if(priority||evening){add=90;label=evening?"Soir 19 h–20 h 59 — passage concerné":"Prioritaire sous 24 h — passage concerné";}
    if(sunday){add=120;label="Dimanche / jour férié — passage concerné";}
    S.result.price=(980+add)+" € TTC";
    S.result.availabilityLabel=label;
    return;
  }

  const b2bBase={
    "VISITE TERRAIN PILOTÉE":350,
    "PRÉSENCE PROJET":490,
    "PRÉSENCE PROJET ÉTENDUE":690
  };
  if(b2bBase[m]!=null){
    const add=(sunday||night)?180:(priority||evening)?120:0;
    const label=sunday?"Dimanche / jour férié":night?"Nuit à partir de 21 h":priority?"Prioritaire sous 24 h":evening?"Soir 19 h–20 h 59":"Standard";
    S.result.price=(b2bBase[m]+add)+" € HT";
    S.result.availabilityLabel=label;
    return;
  }
  if(m==="CONTINUITÉ PROJET"){
    const add=(sunday||night)?180:(priority||evening)?120:0;
    const label=sunday?"Dimanche / jour férié — jalon concerné":night?"Nuit à partir de 21 h — jalon concerné":priority?"Prioritaire sous 24 h — jalon concerné":evening?"Soir 19 h–20 h 59 — jalon concerné":"Standard";
    S.result.price=(1190+add).toLocaleString("fr-FR")+" € HT";
    S.result.availabilityLabel=label;
  }
}

function newGatewayReference(){

 return `D-${stamp}-${suffix}`;
}

async function registerTallyIntent(){
 if(!assertVoirContractInvariant())throw new Error("Incohérence VOIR / contrat.");
 const cents=gatewayPaymentCents();
 if(!Number.isInteger(cents)||cents<=0)throw new Error("Montant de paiement invalide.");

 const sendIntent=async()=>{
   const ref=ensureTallyReference();
   const body={reference:ref,universe:S.universe||"",contract:S.result?.contract||"",mission:tallyMissionValue(),object:S.obj||"",schedule:scheduleText(),email:S.email||"",customer_name:S.name||"",customer_email:S.email||"",customer_phone:S.phone||"",amount_cents:cents,currency:"eur",price_text:paymentAmountText(),availability_mode:tallyAvailabilityMode(),availability_label:S.result?.availabilityLabel||"Standard"};
   const controller=new AbortController();
   const timer=setTimeout(()=>controller.abort(),10000);
   try{
     const r=await fetch(PAYMENT_GATEWAY_URL+"/intent",{method:"POST",headers:{"content-type":"application/json","accept":"application/json"},body:JSON.stringify(body),cache:"no-store",signal:controller.signal});
     const data=await r.json().catch(()=>({}));
     return {r,data};
   }catch(err){
     if(err?.name==="AbortError")throw new Error("Gateway indisponible après 10 secondes");
     throw err;
   }finally{
     clearTimeout(timer);
   }
 };

 let out;
 let lastNetworkError=null;
 // Une seconde tentative réseau est sûre : la création d'intention est idempotente pour une même référence.
 for(let attempt=1;attempt<=2;attempt++){
   try{
     out=await sendIntent();
     lastNetworkError=null;
     break;
   }catch(err){
     lastNetworkError=err;
     if(attempt===2)throw err;
   }
 }
 if(!out && lastNetworkError)throw lastNetworkError;

 const conflictErrors=new Set(["reference_conflict","reference_already_exists_with_different_data"]);
 if(out.r.status===409 && conflictErrors.has(String(out.data?.error||""))){
   S.tallyReference="";
   S.tallyIntentReady=false;
   save();
   out=await sendIntent();
 }
 if(!out.r.ok)throw new Error(out.data?.error||`Gateway HTTP ${out.r.status}`);
 S.tallyIntentReady=true;
 save();
 return out.data;
}

   <div class="field"><label>Date confirmée</label><input id="altDate" type="date" min="${todayLocalISO()}" value="${todayLocalISO()}" onchange="refreshAlternativeConstraints()"></div>

function refreshAlternativeConstraints(){
 const d=document.getElementById("altDate"),t=document.getElementById("altTime");
 if(!d||!t)return;
 const today=todayLocalISO();
 d.min=today;
 if(d.value && d.value<today)d.value="";
}
function confirmAcceptedAlternative(){
 const d=getDateValue("altDate") || todayLocalISO();
 const altDateEl=document.getElementById("altDate");
 if(altDateEl && !altDateEl.value)altDateEl.value=d;
 const t=normalizeTime4(getDropdownTime("altTime"));
 const check=validateMissionTimeRules(d,t,"le créneau alternatif");
 if(!check.ok)return alert(check.msg);
 S.date=d;S.slot=t;S.multiSlots=[];S.availability=autoConstraints(d,t);
 S.decisionStatus="CONFIRMED_AFTER_ALTERNATIVE";
 S.paymentStatus="PAID_CONFIRMED";
 if(!S.missionId)S.missionId=missionId();
 save();
 if(getSyncKey())syncCentralMissions({silent:true}).catch(()=>{});
 preparationMission();
}
async function decisionRefunded(){

   try{await syncCentralMissions({silent:true})}catch(e){
     alert("REMBOURSEMENT ENREGISTRÉ — SYNCHRONISATION AGENDA À CONTRÔLER.");

function clientDocSuggestions(){
  const m=S.result?.mission||"";
  if(S.need==="ART") return ["Bon / ordre d’intervention si disponible","Photo ou consigne utile pour l’artisan"];
  if(S.need==="DEL") return ["Bon de livraison / référence de commande","Consigne utile à l’accès ou à l’installation"];
  if(S.need==="THIRD") return ["Document ou consigne à remettre / montrer au tiers si nécessaire"];
  if(S.need==="KEY") return ["Aucun document particulier en principe","Pièce utile uniquement si elle sécurise la remise / récupération"];
  if(m.includes("AVANT INTEMPÉRIE")) return ["Photo / repère des éléments à fermer ou rentrer","Consigne précise utile à l’intervention"];
  if(m.includes("APRÈS INTEMPÉRIE")) return ["Photo / repère des points à vérifier","Document de référence utile si comparaison nécessaire"];
  if(m.includes("VOIR")) return ["Photo(s) de référence","Devis / facture / document à comparer si utile"];
  if(m==="DÉCIDER") return ["Devis / facture / document du rendez-vous","Photos ou document(s) de référence"];
  if(m==="SUIVRE") return ["Photos / repères de référence","Document de cadrage commun aux 3 passages"];
  if(m==="VISITE TERRAIN PILOTÉE") return ["Brief / plan / photo de repère","Consignes d’accès ou de sécurité du site"];
  if(m==="PRÉSENCE PROJET") return ["Cahier des charges / ordre du jour","Document(s) à montrer, remettre ou vérifier","Consignes du site"];
  if(m==="PRÉSENCE PROJET ÉTENDUE") return ["Cahier des charges / ordre du jour","Plan / documents utiles aux différentes zones","Consignes du site"];
  if(m==="CONTINUITÉ PROJET") return ["Cahier des charges commun","Photos / repères de référence","Plan ou document de comparaison"];
  if(["ACCÈS B2B","PRÉSENCE LOGISTIQUE B2B","REMISE CLÉ / BADGE B2B","RÉCUPÉRATION CLÉ / BADGE B2B"].includes(m))
    return ["Bon d’intervention / bon de livraison si disponible","Consigne d’accès / référence utile"];
  return ["Document ou photo réellement utile à la mission, uniquement si nécessaire"];
}

function collectPreparation(){
 const b2b=S.caller==="B2B";
 const contactChoice=b2b?(document.querySelector('input[name="contactChoice"]:checked')?.value||""):"OPTIONNEL";
 const docsChoice=document.querySelector('input[name="docsChoice"]:checked')?.value||"";

 if(b2b && !contactChoice)return alert("Choisissez NOM + TÉLÉPHONE ou AUCUN.");
 if(!docsChoice)return alert("Choisissez OUI — AJOUTER ou AUCUN DOCUMENT.");

 const contact=(document.getElementById('contact')?.value||"").trim();
 if(b2b && contactChoice==="CONTACT" && !contact)return alert("Renseignez le nom + téléphone du contact.");
 const map=(document.getElementById('map')?.value||"").trim();
 if(b2b && !map)return alert("B2B : localisation / lien Plans ou Maps obligatoire.");

 const files=[...(document.getElementById('docs')?.files||[])].map(f=>f.name);
 if(docsChoice==="OUI" && !files.length)return alert("Ajoutez au moins un document / une photo, ou choisissez AUCUN DOCUMENT.");

 let h={
   addr:document.getElementById('addr').value.trim(),
   access:document.getElementById('access').value,
   mode:document.getElementById('mode').value,
   contactChoice,
   contact:contactChoice==="AUCUN"?"AUCUN":contact,
   map,
   docsChoice,
   docs:files,
   note:(document.getElementById('note')?.value||"").trim()
 };
 if(!h.addr)return alert("Adresse exacte obligatoire.");

 S.prep=h;
 save();
 if(getSyncKey())syncCentralMissions({silent:true}).catch(()=>{});
 ready();
}

function docPack(){
  const m=S.result?.mission||"";
  let fiche="Fiche mission";
  let checklist="Checklist courte adaptée";
  let support="Aucun document supplémentaire";
  let rest=S.result?.rest||"R0";

  if(m==="DÉCIDER"){support="Cahier des charges validé";rest="R2"}
  else if(m==="SUIVRE"){support="Cahier des charges commun aux 3 passages";rest="R3 comparative"}
  else if(m==="PRÉSENCE PROJET"){support="Cahier des charges validé";rest="R2 B2B"}
  else if(m==="PRÉSENCE PROJET ÉTENDUE"){support="Objectif unique + brief validé";rest="R2 B2B"}
  else if(m==="CONTINUITÉ PROJET"){support="Cahier des charges commun aux 3 jalons";rest="R3 B2B"}
  else if(m==="VISITE TERRAIN PILOTÉE"){support="Brief / objectif validé";rest="R1 B2B"}
  else if(m.includes("APRÈS INTEMPÉRIE")){support="Sécurité / électricité";rest="R0-C"}
  else if(m.includes("VOIR")){support="Périmètre d’observation";rest="R1"}
  else if(m.includes("CLÉ / BADGE") || S.need==="KEY"){rest="R0-B"}
  else if(["ACCÈS B2B","PRÉSENCE LOGISTIQUE B2B","REMISE CLÉ / BADGE B2B","RÉCUPÉRATION CLÉ / BADGE B2B"].includes(m)){support="Consigne logistique";rest="R0 B2B"}

  return {fiche,checklist,support,rest};
}

const MEDIA_DB_NAME="cyrnea_media_v1";
const MEDIA_DB_STORE="terrain_files";
function openMediaDb(){
 return new Promise((resolve,reject)=>{
   if(!("indexedDB" in window))return reject(new Error("indexeddb_unavailable"));
   const req=indexedDB.open(MEDIA_DB_NAME,1);
   req.onupgradeneeded=()=>{
     const db=req.result;
     if(!db.objectStoreNames.contains(MEDIA_DB_STORE)){
       const store=db.createObjectStore(MEDIA_DB_STORE,{keyPath:"id"});
       store.createIndex("missionId","missionId",{unique:false});
       store.createIndex("missionPassage","missionPassage",{unique:false});
     }
   };
   req.onsuccess=()=>resolve(req.result);
   req.onerror=()=>reject(req.error||new Error("indexeddb_open_failed"));
 });
}

 const passage=Number(st.passage||1);
 const db=await openMediaDb();
 await new Promise((resolve,reject)=>{
   const tx=db.transaction(MEDIA_DB_STORE,"readwrite");
   const store=tx.objectStore(MEDIA_DB_STORE);
   [...files].forEach((file,i)=>{
     const id=[missionId,passage,file.name,file.size,file.lastModified||0].join("::");
     store.put({
       id,
       missionId,
       passage,
       missionPassage:missionId+"::"+passage,
       name:file.name,
       type:file.type||"application/octet-stream",
       size:Number(file.size||0),
       lastModified:Number(file.lastModified||0),
       storedAt:Date.now(),
       blob:file
     });
   });
   tx.oncomplete=()=>resolve();
   tx.onerror=()=>reject(tx.error||new Error("indexeddb_write_failed"));
   tx.onabort=()=>reject(tx.error||new Error("indexeddb_write_aborted"));
 });
 db.close();
}
async function getTerrainMediaRecords(st=S,allPassages=false){
 const missionId=activeMissionKey(st);
 if(!missionId)return [];
 const passage=Number(st.passage||1);
 const db=await openMediaDb();
 const records=await new Promise((resolve,reject)=>{
   const tx=db.transaction(MEDIA_DB_STORE,"readonly");
   const store=tx.objectStore(MEDIA_DB_STORE);
   const index=store.index(allPassages?"missionId":"missionPassage");
   const req=index.getAll(allPassages?missionId:(missionId+"::"+passage));
   req.onsuccess=()=>resolve(Array.isArray(req.result)?req.result:[]);
   req.onerror=()=>reject(req.error||new Error("indexeddb_read_failed"));
 });
 db.close();
 return records.sort((a,b)=>(a.storedAt||0)-(b.storedAt||0));
}

}

function crc32(bytes){
 let table=crc32._table;
 if(!table){
   table=new Uint32Array(256);
   for(let n=0;n<256;n++){
     let x=n;
     for(let k=0;k<8;k++)x=(x&1)?(0xEDB88320^(x>>>1)):(x>>>1);
     table[n]=x>>>0;
   }
   crc32._table=table;
 }
 let crc=0xFFFFFFFF;
 for(let i=0;i<bytes.length;i++)crc=table[(crc^bytes[i])&0xFF]^(crc>>>8);
 return (crc^0xFFFFFFFF)>>>0;
}
function u16(n){
 const a=new Uint8Array(2),v=new DataView(a.buffer);v.setUint16(0,n,true);return a;
}
function u32(n){
 const a=new Uint8Array(4),v=new DataView(a.buffer);v.setUint32(0,n>>>0,true);return a;
}
function concatBytes(parts){
 const total=parts.reduce((s,p)=>s+p.length,0);
 const out=new Uint8Array(total);
 let o=0;
 for(const p of parts){out.set(p,o);o+=p.length}
 return out;
}
function dosDateTime(d=new Date()){
 let year=Math.max(1980,d.getFullYear());
 const time=((d.getHours()&31)<<11)|((d.getMinutes()&63)<<5)|((Math.floor(d.getSeconds()/2))&31);
 const date=(((year-1980)&127)<<9)|(((d.getMonth()+1)&15)<<5)|(d.getDate()&31);
 return {time,date};
}
async function makeStoredZip(entries){
 const enc=new TextEncoder();
 const locals=[],centrals=[];
 let offset=0;
 for(const entry of entries){
   const nameBytes=enc.encode(entry.name);
   const data=entry.data instanceof Uint8Array?entry.data:new Uint8Array(entry.data);
   const crc=crc32(data);
   const dt=dosDateTime(entry.date||new Date());
   const flags=0x0800;
   const local=concatBytes([
     u32(0x04034b50),u16(20),u16(flags),u16(0),u16(dt.time),u16(dt.date),
     u32(crc),u32(data.length),u32(data.length),u16(nameBytes.length),u16(0),
     nameBytes,data
   ]);
   locals.push(local);
   const central=concatBytes([
     u32(0x02014b50),u16(20),u16(20),u16(flags),u16(0),u16(dt.time),u16(dt.date),
     u32(crc),u32(data.length),u32(data.length),u16(nameBytes.length),u16(0),u16(0),
     u16(0),u16(0),u32(0),u32(offset),nameBytes
   ]);
   centrals.push(central);
   offset+=local.length;
 }
 const centralBytes=concatBytes(centrals);
 const localBytes=concatBytes(locals);
 const end=concatBytes([
   u32(0x06054b50),u16(0),u16(0),u16(entries.length),u16(entries.length),
   u32(centralBytes.length),u32(localBytes.length),u16(0)
 ]);
 return new Blob([localBytes,centralBytes,end],{type:"application/zip"});
}

async function exportMissionArchive(){

 if(btn){btn.disabled=true;btn.textContent="PRÉPARATION DU DOSSIER…"}
 try{
   const enc=new TextEncoder();
   const entries=[];
   entries.push({name:"DOSSIER_MISSION.txt",data:enc.encode(missionArchiveText())});
   entries.push({name:"MISSION.json",data:enc.encode(JSON.stringify(S,null,2))});
   let media=[];
   try{media=await getTerrainMediaRecords(S,true)}catch(e){}
   const used=new Map();
   for(const r of media){
     let base=String(r.name||"fichier");
     const count=used.get(base)||0;
     used.set(base,count+1);
     if(count){
       const dot=base.lastIndexOf(".");
       base=dot>0?base.slice(0,dot)+"_"+(count+1)+base.slice(dot):base+"_"+(count+1);
     }
     const passage=String(r.passage||1).padStart(2,"0");
     const ab=await r.blob.arrayBuffer();
     entries.push({name:"MEDIA/PASSAGE_"+passage+"/"+base,data:new Uint8Array(ab)});
   }
   const zip=await makeStoredZip(entries);
   const filename=safeArchiveName(S.missionId)+".zip";
   const file=new File([zip],filename,{type:"application/zip"});
   if(navigator.canShare && navigator.share && navigator.canShare({files:[file]})){
     await navigator.share({
       files:[file],
       title:"Archive CYRNEA — "+(S.missionId||"mission"),

     });
   }else{
     const a=document.createElement("a");
     const url=URL.createObjectURL(zip);
     a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
     setTimeout(()=>URL.revokeObjectURL(url),30000);
     alert("Le dossier ZIP a été préparé. Enregistrez-le dans iCloud Drive / CYRNEA / MISSIONS / "+(S.result?.contract==="RELAIS"?"RELAIS":"PRÉSENCE")+".");
   }
 }catch(e){
   if(e?.name!=="AbortError")alert("Export impossible : "+String(e?.message||e));
 }finally{

}

function collectTerrain(){
  if(!S.arrivalAt)return alert("Appuyez d’abord sur J’ARRIVE SUR PLACE pour horodater le début de mission.");
  if(!allChecked("input[name='terrainGuard']"))return alert("Tous les garde-fous applicables doivent être vérifiés avant de quitter.");
  if(!allChecked("input[name='exitCheck']"))return alert("Effectuez les contrôles de sortie avant de quitter les lieux.");

  const facts=[...document.querySelectorAll("input[name='terrainFact']:checked")].map(x=>x.value);
  const other=(document.getElementById("factOther")?.value||"").trim();
  if(other)facts.push(other);
  if(!facts.length)return alert("Cochez au moins un fait / une action réellement réalisé(e) ou observé(e).");

  const inc=document.getElementById("incidentSelect").value;
  if(!inc)return alert("Choisissez la situation : AUCUN INCIDENT ou un incident / une limite.");
  let incText=inc;
  if(inc==="AUTRE"){
    incText=(document.getElementById("incidentOther")?.value||"").trim();
    if(!incText)return alert("Précisez l’incident / la limite.");
  }

  S.terrainMedia=terrainMediaNames();
  S.facts=facts.join(" ; ");
  S.incident=inc==="AUCUN"?"Aucun":incText;
  S.departureAt=nowStamp();
  S.terrainDraft=null;
  save();
  restitution();
}

   agreementAt:nowStamp(),
   paymentStatus:"PENDING",
   paymentLink:isRelais?(RELAIS_OVERRUN_PAYMENT_LINKS[total]||""):"",
   paymentProvider:isRelais?"STRIPE_PAYMENT_LINK":"CYRNEA_GATEWAY_PENDING"
 };
 save(); terrain();
}
function openOverrunPayment(){
 const url=String(S.overrun?.paymentLink||"");
 if(!url)return alert("Le paiement automatique de ce supplément PRÉSENCE / B2B doit encore être raccordé au gateway CYRNEA. Encaissez le supplément via le moyen de paiement actif, puis confirmez sa réception dans la PWA.");
 window.open(url,"_blank","noopener");
}
function markOverrunPaid(){
 if(!S.overrun?.accepted)return;
 S.overrun.paymentStatus="PAID";
 S.overrun.paidAt=nowStamp();
 save();
 closeMission();
}

function extraMomentRule(){
 const m=baseMissionName(S.result?.mission||"");
 if(m==="SUIVRE") return {unit:300,base:"TTC",name:"moment"};
 if(m==="CONTINUITÉ PROJET") return {unit:420,base:"HT",name:"jalon"};
 return null;
}
function extraMomentInfo(){
 const r=extraMomentRule();
 if(!r)return;
 const next=S.passage+1;
 if(next>5){
   return draw(`<div class="card"><h1>Passage supplémentaire</h1><div class="stop"><b>À PARTIR DU 6e</b><br>Devis, requalification ou refus si la demande devient récurrente. Ne pas lancer un nouveau passage automatiquement.</div><button class="btn ghost" onclick="restitution()">RETOUR</button></div>`);
 }
 draw(`<div class="card"><h1>${next}e ${esc(r.name)} lié</h1>
   <div class="notice"><b>SUPPLÉMENT</b>+${r.unit} € ${r.base} pour ce ${r.name}, même dossier et même objet.</div>
   <div class="readAloud">Un ${next}e ${r.name} est possible dans le même dossier et pour le même objet, avec un supplément de ${r.unit} € ${r.base}. Il devra être validé avant ce nouveau passage.</div>
   <div class="warn">Ne pas partir sur ce nouveau passage tant que le créneau, le supplément et la réservation / validation correspondante ne sont pas confirmés.</div>
   <button class="btn ghost" onclick="restitution()">RETOUR</button>
 </div>`);
}
function terrain(){
 setStage("TERRAIN");
 let rules=[];
 if(S.result.mission.includes("APRÈS INTEMPÉRIE"))rules=["Vérifier AVANT toute manipulation : pas d'eau","Pas d'humidité anormale","Pas d'odeur de brûlé","Pas d'échauffement","Pas de dommage visible","Un seul réarmement simple maximum si prévu"];
 else if(S.result.mission.includes("VOIR"))rules=["Observer uniquement le périmètre prévu","Séparer OBSERVÉ / DÉCLARÉ / DOCUMENT / NON VÉRIFIABLE","Aucun diagnostic / conformité / cause"];
 else if(S.result.mission==="DÉCIDER"||S.result.mission.includes("PRÉSENCE PROJET"))rules=["Suivre le cahier des charges","Poser uniquement les questions convenues","Aucune décision ou signature pour le client"];
 else rules=["Exécuter uniquement l'objet prévu","Ne pas élargir la mission","Documenter uniquement les preuves utiles"];
 if(needsWaitGuard())rules.push("Si tiers / professionnel absent ou en retard : attente incident maximum 15 minutes");

 const facts=terrainFactOptions();

 draw(`<div class="card"><h1>Sur place — passage ${S.passage}</h1><div class="operatorOnly">Suivez l’ordre : arrivée → contrôles → actions prévues → preuves utiles → contrôle de sortie. Si la situation diffère, n’improvisez pas.</div>
 <div class="todo"><b>À FAIRE SUR PLACE</b>Cochez uniquement ce que vous avez réellement vérifié, fait ou observé. Les coches servent directement à fabriquer la restitution.</div>
 ${S.arrivalAt
   ? `<div class="notice"><b>ARRIVÉE HORODATÉE</b>${esc(S.arrivalAt)}</div>`
   : `<button class="btn primary" onclick="markArrival()">J’ARRIVE SUR PLACE — HORODATER</button>`}
 <div class="advice"><b>CONSEIL</b>Les cases ci-dessous sont vos contrôles internes. Le client n’a rien à cocher ici.</div>

 <div class="row"><b>${esc(S.missionId)}</b><span>${esc(S.result.mission)}</span></div>
 <div class="toolbar"><button class="btn ghost" onclick="missionDesk()">DOSSIER MISSION</button></div>

 <div class="checkZone">
   <div class="checkIntro">GARDE-FOUS À COCHER</div>
   ${rules.map(x=>`<label class="check"><input type="checkbox" name="terrainGuard"> <span>J’ai vérifié / appliqué : <b>${esc(x)}</b></span></label>`).join("")}
 </div>

 <div class="checkZone">
   <div class="checkIntro">FAITS / ACTIONS UTILES — PLUSIEURS CHOIX POSSIBLES</div>
   ${facts.map(x=>`<label class="check"><input type="checkbox" name="terrainFact" value="${esc(x)}"> <span>${esc(x)}</span></label>`).join("")}
   <button class="btn ghost" onclick="document.getElementById('factOtherWrap').classList.toggle('hidden')">+ AUTRE FAIT — EXCEPTION</button>
   <div class="field hidden" id="factOtherWrap"><label>Autre fait — quelques mots</label><input id="factOther" maxlength="140" placeholder="Uniquement si aucune case ne convient."></div>
 </div>

 <div class="field">
   <label>PHOTOS / PREUVES TERRAIN (SI UTILES)</label>
   <input id="terrainMedia" type="file" accept="image/*,video/*,.pdf" capture="environment" multiple onchange="storeSelectedTerrainMedia()">
   <div class="muted">Sur iPhone : prendre directement une photo/vidéo ou choisir une pièce existante. Les fichiers sélectionnés sont maintenant conservés localement dans la PWA sur cet appareil, en attendant l’export documentaire iCloud.</div>
   <div id="terrainMediaStoredStatus" class="notice"><b>FICHIERS RÉELLEMENT CONSERVÉS : contrôle en cours…</b></div>
 </div>

 <div class="field" id="incidentZone">
   <label>INCIDENT / LIMITE ÉVENTUEL — UN CHOIX PRINCIPAL</label>
   <select id="incidentSelect" onchange="toggleIncidentOther()">
     <option value="">— Choisir —</option>
     <option value="AUCUN">AUCUN INCIDENT / AUCUNE LIMITE</option>
     <option value="Tiers / professionnel absent">Tiers / professionnel absent</option>
     <option value="Accès impossible ou partiel">Accès impossible ou partiel</option>
     <option value="Retard important du tiers / professionnel">Retard important du tiers / professionnel</option>
     <option value="Demande nouvelle hors mission">Demande nouvelle hors mission</option>
     <option value="Information indispensable manquante">Information indispensable manquante</option>
     <option value="Situation de sécurité / danger">Situation de sécurité / danger</option>
     <option value="SITUATION DIFFÉRENTE / DOUTE">SITUATION DIFFÉRENTE / J’AI UN DOUTE</option>
     <option value="Élément prévu non observable / non vérifiable">Élément prévu non observable / non vérifiable</option>
     <option value="AUTRE">AUTRE — à préciser</option>
   </select>
 </div>
 <div class="field hidden" id="incidentOtherWrap">
   <label>Précisez l’incident / la limite</label>
   <textarea id="incidentOther" placeholder="Décrire uniquement le fait constaté, sans interprétation."></textarea>
 </div>

 <div class="stop"><b>LA SITUATION EST DIFFÉRENTE / J'AI UN DOUTE</b><br>Ne pas improviser · constater · ne pas aggraver · documenter · requalifier avant élargissement.<br><br><button class="btn danger" onclick="triggerDoubt()">J’AI UN DOUTE / SITUATION DIFFÉRENTE</button></div>
 <div class="warn"><b>LE TEMPS PRÉVU EST DÉPASSÉ ?</b><br>Ne prolongez jamais de vous-même. L’assistant applique la règle de la mission.<br><br>${S.arrivalAt?`<button class="btn ghost" onclick="overrunGuide()">TEMPS / CADRE DÉPASSÉ</button>`:`<div class="muted">La prolongation devient disponible après « J’ARRIVE SUR PLACE — HORODATER ».</div>`}${S.overrun?.accepted?`<div class="notice" style="margin-top:10px"><b>PROLONGATION ACCEPTÉE</b>+${esc(String(S.overrun.total))} € ${esc(S.overrun.base)} — ${esc(String(S.overrun.tranches))} tranche(s).</div>`:""}</div>

 <div class="checkZone">
   <div class="checkIntro">AVANT DE QUITTER LES LIEUX — CONTRÔLES CRITIQUES</div>
   <label class="check"><input type="checkbox" name="exitCheck"><span>Accès / clés / badge laissés conformément à la mission</span></label>
   <label class="check"><input type="checkbox" name="exitCheck"><span>Portes / ouvrants / équipements simples laissés dans l’état prévu</span></label>
   <label class="check"><input type="checkbox" name="exitCheck"><span>Tiers / professionnel : situation connue ou incident documenté si applicable</span></label>
   <label class="check"><input type="checkbox" name="exitCheck"><span>Preuves utiles / photos nécessaires prises ou absence justifiée</span></label>
 </div>

 <button class="btn primary" onclick="collectTerrain()">J’AI TERMINÉ SUR PLACE</button>
 </div>`);
 restoreTerrainDraft();
 setTimeout(refreshTerrainMediaStatus,0);
}
function restitution(){
 setStage("RESTITUTION");
 const interim=S.result.multi&&S.passage<3;
 draw(`<div class="card"><h1>${interim?"Restitution intermédiaire":"Restitution finale"}</h1><div class="operatorOnly">Décrivez uniquement ce qui a été vu, fait, dit ou impossible à vérifier. Pas d’interprétation technique.</div>
 <div class="row"><b>Référence</b><span>${esc(S.missionId)}</span></div>
 <div class="row"><b>Passage</b><span>${esc(String(S.passage))}</span></div>
 <div class="row"><b>Objet</b><span>${esc(S.obj)}</span></div>
 <div class="row"><b>Arrivée</b><span>${esc(S.arrivalAt||"-")}</span></div>
 <div class="row"><b>Départ</b><span>${esc(S.departureAt||"-")}</span></div>
 <div class="row"><b>Faits/actions</b><span>${esc(S.facts||"À compléter")}</span></div>
 <div class="row"><b>Incident/limite</b><span>${esc(S.incident||"Aucun")}</span></div>
 ${S.overrun?.accepted?`<div class="row"><b>Prolongation</b><span>+${esc(String(S.overrun.total))} € ${esc(S.overrun.base)} — ${esc(String(S.overrun.tranches))} tranche(s) de 30 min</span></div>
 <div class="row"><b>Accord client</b><span>${esc(S.overrun.agreementMethod==="SMS"?"SMS reçu":"Accord téléphonique")} — ${esc(S.overrun.agreementAt||"-")}</span></div>
 <div class="row"><b>Supplément</b><span>${esc(S.overrun.paymentStatus==="PAID"?"RÉGLÉ":S.overrun.paymentStatus==="PENDING"?"À ENCAISSER":"À VÉRIFIER")}</span></div>`:""}
 <div class="row"><b>Médias / preuves</b><span>${S.terrainMedia.length?esc(S.terrainMedia.join(" • ")):"AUCUN FICHIER AJOUTÉ"}</span></div>
 <div class="notice">La PWA rassemble les données nécessaires à la restitution R0/R1/R2/R3 et évite de ressaisir les informations déjà connues.</div>
 ${interim
   ? `<button class="btn primary" onclick="continueMultiAfterRestitution()">ENREGISTRER L’INTERMÉDIAIRE ET PRÉPARER LE PASSAGE ${S.passage+1}</button>`
   : `<button class="btn primary" onclick="closeMission()">VALIDER LA RESTITUTION FINALE</button>${S.result.multi&&S.passage>=3?`<button class="btn ghost" onclick="extraMomentInfo()" style="margin-top:10px">UN 4e / 5e PASSAGE LIÉ EST ENVISAGÉ</button>`:""}`}
 </div>`);
 save();
}
function closeMission(){
 if(!S.departureAt)return alert("Impossible de clôturer sans contrôle terrain terminé et heure de départ.");
 setStage("CLÔTURE");
 const ov=S.overrun?.accepted?S.overrun:null;
 const unpaidOverrun=!!(ov&&ov.paymentStatus!=="PAID");
 const paymentBlock=ov?`
   <div class="${ov.paymentStatus==="PAID"?"notice":"warn"}"><b>SUPPLÉMENT DE PROLONGATION</b><br>
   ${esc(String(ov.tranches))} tranche(s) × ${esc(String(ov.unit))} € ${esc(ov.base)} = <b>${esc(String(ov.total))} € ${esc(ov.base)}</b><br>
   Accord : ${esc(ov.agreementMethod==="SMS"?"SMS reçu":"Accord téléphonique")} — ${esc(ov.agreementAt||"-")}<br>
   Statut : <b>${esc(ov.paymentStatus==="PAID"?"RÉGLÉ":ov.paymentStatus==="PENDING"?"À ENCAISSER":"À VÉRIFIER")}</b></div>
   ${ov.paymentStatus==="PENDING"&&ov.paymentLink?`<div class="toolbar"><button class="btn primary" onclick="openOverrunPayment()">OUVRIR LE PAIEMENT STRIPE — ${esc(String(ov.total))} € TTC</button><button class="btn ghost" onclick="markOverrunPaid()">PAIEMENT REÇU → MARQUER RÉGLÉ</button></div>`:""}
   ${ov.paymentStatus==="PENDING"&&!ov.paymentLink?`<div class="warn"><b>SUPPLÉMENT À ENCAISSER</b><br>${esc(String(ov.total))} € ${esc(ov.base)}. Ne clôturez pas le dossier tant que le règlement n’est pas réellement reçu.</div><div class="toolbar"><button class="btn ghost" onclick="markOverrunPaid()">PAIEMENT RÉELLEMENT REÇU → MARQUER RÉGLÉ</button></div>`:""}
   `:"";
 if(unpaidOverrun)S.finalStatus="MISSION TERRAIN TERMINÉE — SUPPLÉMENT À ENCAISSER";
 save();
 draw(`<div class="card"><h1>Clôture</h1>
 <div class="todo"><b>À FAIRE</b>${unpaidOverrun?"Le terrain est terminé. Le dossier reste ouvert jusqu’au règlement du supplément.":"Choisir le statut réel avant archivage."}</div>
 <div class="row"><b>Arrivée</b><span>${esc(S.arrivalAt)}</span></div>
 <div class="row"><b>Départ</b><span>${esc(S.departureAt)}</span></div>
 <div class="row"><b>Incident</b><span>${esc(S.incident||"Aucun")}</span></div>
 ${paymentBlock}
 ${unpaidOverrun
   ? `<div class="row"><b>Statut du dossier</b><span>MISSION TERRAIN TERMINÉE — SUPPLÉMENT À ENCAISSER</span></div>`
   : `<div class="field"><label>Statut final</label><select id="fs">
       <option>MISSION RÉALISÉE ET CLÔTURÉE</option>
       <option>MISSION PARTIELLEMENT RÉALISÉE ET CLÔTURÉE</option>
       <option>MISSION IMPOSSIBLE À RÉALISER - CLÔTURÉE AVEC MOTIF DOCUMENTÉ</option>
     </select></div>`}
 <div class="notice">${S.result.contract.startsWith("PRÉSENCE")?"H5 / restitution finale à envoyer.":"Restitution RELAIS à envoyer."}</div>
 ${unpaidOverrun
   ? `<button class="btn primary" onclick="goHome()">CONSERVER EN ATTENTE DE PAIEMENT → ACCUEIL</button><div class="muted">Cette mission reste dans MISSIONS ACTIVES. Elle pourra être rouverte dès réception du supplément.</div>`
   : `<button class="btn primary" onclick="finalizeArchive()">ARCHIVER LE DOSSIER</button>`}
 </div>`);
}
function finalizeArchive(){
 if(S.overrun?.accepted && S.overrun.paymentStatus!=="PAID"){
   return alert("Supplément de prolongation non réglé. La mission ne peut pas être archivée définitivement tant que le paiement n’est pas confirmé.");
 }
 S.finalStatus=document.getElementById("fs")?.value||S.finalStatus||"MISSION CLÔTURÉE";
 save();archive();
}
function archive(){setStage("ARCHIVE");save();const archivedId=activeMissionKey(S);if(archivedId){writeDeletedIds(loadDeletedIds().filter(x=>x!==archivedId));if(getSyncKey())syncCentralMissions({silent:true}).catch(()=>{})}const refunded=S.paymentStatus==="REFUNDED";draw(`<div class="card"><h1>${refunded?"Dossier remboursé et archivé":"Mission archivée"}</h1><div class="row"><b>Référence</b><span>${esc(S.missionId)}</span></div><div class="row"><b>Mission</b><span>${esc(S.result.mission)}</span></div><div class="row"><b>Statut</b><span>${esc(S.finalStatus)}</span></div>${S.overrun?.accepted?`<div class="row"><b>Prolongation</b><span>${esc(String(S.overrun.total))} € ${esc(S.overrun.base)} — ${esc(S.overrun.paymentStatus==="PAID"?"RÉGLÉ":"À SUIVRE")}</span></div>`:""}<div class="row"><b>Archive cible</b><span>iCloud Drive / CYRNEA / MISSIONS / ${esc(S.result.contract==="RELAIS"?"RELAIS":"PRÉSENCE")} / ${esc(S.missionId)}</span></div><div class="notice">${refunded?"Dossier arrêté après remboursement. Aucun départ terrain ne doit être effectué.":"Mission terminée : appel → préparation → terrain → restitution → clôture."}<br><br><b>Archivage :</b> la mission clôturée reste conservée dans la base centrale CYRNEA et n’apparaît plus dans les missions actives. L’archive iCloud reste le stockage documentaire de fond.</div><div class="toolbar"><button id="archiveExportBtn" class="btn primary" onclick="exportMissionArchive()">EXPORTER LE DOSSIER → FICHIERS / iCLOUD</button><button class="btn ghost" onclick="newMission()">NOUVELLE MISSION</button></div></div>`)}
function exportJSON(){let b=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});let a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=(S.missionId||"CYRNEA-DEMO")+".json";a.click();URL.revokeObjectURL(a.href)}
function boot(){
 try{STAGE_VIEWS=JSON.parse(localStorage.getItem(STAGE_VIEWS_KEY)||"{}")||{}}catch(e){STAGE_VIEWS={}}
 const raw=localStorage.getItem(STATE_KEY)||localStorage.getItem(LEGACY_STATE_KEY);
 if(raw){
   try{
     const p=JSON.parse(raw);
     S={...S,...p,prep:{...(p.prep||{})},multiSlots:Array.isArray(p.multiSlots)?p.multiSlots:[],availability:{...(p.availability||{})},overrun:p.overrun||null,specialPending:false,resumeStage:p.resumeStage||""};
     if(p.specialPending && S.result) S.acceptedSlot=true;
     if(!Array.isArray(S.history))S.history=["ACCUEIL"];
     REACHED_STAGES=new Set(S.history); REACHED_STAGES.add("ACCUEIL"); syncReached();
     if(S.stage && S.stage!=="ACCUEIL") S.resumeStage=S.stage;
     save();
     if(S.finalStatus || S.stage==="ARCHIVE"){
       persistActiveSnapshot(S);
       markMissionDirty(S);
     }
   }catch(e){}
 }
 REACHED_STAGES=new Set(Array.isArray(S.history)?S.history:["ACCUEIL"]);REACHED_STAGES.add("ACCUEIL");syncReached(); NAV=[]; LAST_VIEW=null; drawTimeline(); home(false); updateBack();
 if(getSyncKey())syncCentralMissions({silent:true}).then(()=>home(false)).catch(()=>{});
}
boot();
</script>

if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', async () => {
    try{
      const reg=await navigator.serviceWorker.register('./service-worker.js',{updateViaCache:'none'});
      reg.update().catch(()=>{});
    }catch(e){}
  });
}
