name: CYRNEA Tally — six-form browser QA (no submission)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Test six forms without submission or payment
        run: node tests/tally-sixforms/smoke.cjs
      - name: Save audit results and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tally-sixforms-no-submit
          path: tally-audit-results/
          retention-days: 5


  matrix-readonly:
    name: Matrix test (no submission) form ${{ matrix.form_index }}
    runs-on: ubuntu-latest
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        form_index: [0,1,2,3,4,5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Check legal blocks keys stops and recovery without payment
        env:
          FORM_INDEX: ${{ matrix.form_index }}
        run: node tests/tally-sixforms/matrix.cjs
      - name: Save evidence per form
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tally-matrix-form-${{ matrix.form_index }}
          path: tally-matrix-results/
          retention-days: 7


  prices-readonly:
    name: Prices, TVA and contacts (form ${{ matrix.form_index }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        form_index: [0,1,2,3,4,5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Audit amounts, VAT and mandatory contact fields without ordering
        env:
          FORM_INDEX: ${{ matrix.form_index }}
        run: node tests/tally-sixforms/prices.cjs
      - name: Save price checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tally-prices-form-${{ matrix.form_index }}
          path: tally-prices-results/
          retention-days: 7
