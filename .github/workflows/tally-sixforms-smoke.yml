name: CYRNEA Tally — six-form browser QA (no submission)
on:
  push:
    branches:
      - audit/tally-6forms-readonly-20261014
    paths:
      - 'tests/tally-sixforms/**'
      - '.github/workflows/tally-sixforms-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Test six forms without submission or payment
        run: node tests/tally-sixforms/smoke.cjs
      - name: Save audit results and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tally-sixforms-no-submit
          path: tally-audit-results/
          retention-days: 5
