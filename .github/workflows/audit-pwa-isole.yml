name: Audit PWA isole (sans paiement)
on:
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * 1'
  pull_request:
    paths:
      - 'tests/**'
      - 'playwright.config.cjs'
      - 'package.json'
      - '.github/workflows/audit-pwa-isole.yml'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer Playwright
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Tests isoles desktop et mobile
        run: npm run test:audit
      - name: Rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-audit-pwa
          path: playwright-report/
          if-no-files-found: ignore
