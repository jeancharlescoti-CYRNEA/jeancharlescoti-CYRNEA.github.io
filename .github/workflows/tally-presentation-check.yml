name: CYRNEA Tally - controls affichage montants euros et TTC
on:
  push:
    branches:
      - audit/tally-6forms-readonly-20261014
    paths:
      - 'tests/tally-sixforms/presentation-audit.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  presentation:
    name: Montants et affichage (form ${{ matrix.index }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        index: [0,1,2,3,4,5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Check mission display, amount symbols, totals, contacts, responsive
        env:
          FORM_INDEX: ${{ matrix.index }}
        run: node tests/tally-sixforms/presentation-audit.cjs
      - name: Save results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tally-presentation-form-${{ matrix.index }}
          path: tally-presentation-results/
          retention-days: 10
