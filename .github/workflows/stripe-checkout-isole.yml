name: CYRNEA - Stripe Checkout TEST 19 missions
on:
  push:
    branches: [audit-playwright-isole-20261121]
    paths:
      - '.github/workflows/stripe-checkout-isole.yml'
      - 'tests/checkout-stripe-isole.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stripe-checkout-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer Playwright
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Paiements Stripe TEST dans Checkout (aucun LIVE)
        run: node tests/checkout-stripe-isole.cjs
      - name: Conserver les preuves (rapports et captures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cyrnea-stripe-checkout-test-evidence
          path: |
            stripe-test-results.json
            stripe-test-*.png
          if-no-files-found: ignore
