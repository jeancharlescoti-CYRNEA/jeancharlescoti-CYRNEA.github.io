name: CYRNEA Tally - preuve STOP RELAIS apres publication
on:
  push:
    branches: [audit/tally-6forms-readonly-20261014]
    paths: ['tests/tally-sixforms/relais-stop-after-fix.cjs']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Check RELAIS STOP desktop and mobile without submission
        run: node tests/tally-sixforms/relais-stop-after-fix.cjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relais-stop-qa
          path: relais-stop-results/
          retention-days: 7
